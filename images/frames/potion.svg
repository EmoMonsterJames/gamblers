<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Potion frame (hospital shop): green glass rim, potion bottles in the corners, bubbles -->
  <defs>
    <linearGradient id="ptRim" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1f8a3a"/><stop offset=".6" stop-color="#5fe08a"/><stop offset="1" stop-color="#c8ffd8"/></linearGradient>
    <g id="ptBottle">
      <rect x="-5" y="-22" width="10" height="9" rx="2" fill="#a0703a" stroke="#5a3a10" stroke-width="2"/>
      <path d="M-4 -13 L4 -13 L4 -6 C14 -2 16 6 16 12 C16 22 8 26 0 26 C-8 26 -16 22 -16 12 C-16 6 -14 -2 -4 -6 Z" fill="#e8fff0" fill-opacity=".85" stroke="#1f6a3a" stroke-width="2.5"/>
      <path d="M-14 10 C-6 6 6 14 14 10 C14 20 8 24 0 24 C-8 24 -14 20 -14 10 Z" fill="#3ad86a"/>
      <circle cx="-5" cy="16" r="2" fill="#fff"/><circle cx="5" cy="12" r="1.6" fill="#fff"/>
      <path d="M-9 2 C-10 6 -10 8 -9 10" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="26" fill="none" stroke="#e8fff0" stroke-width="15"/>
  <rect x="20" y="20" width="160" height="160" rx="26" fill="none" stroke="url(#ptRim)" stroke-width="10"/>
  <rect x="27" y="27" width="146" height="146" rx="20" fill="none" stroke="#b8ffd0" stroke-width="2"/>
  <!-- liquid drips from the top rim -->
  <path d="M60 20 C60 30 66 30 66 20 M118 20 C118 34 126 34 126 20 M150 20 C150 28 155 28 155 20" fill="#3ad86a" stroke="#1f8a3a" stroke-width="2"/>
  <!-- bubbles -->
  <g fill="#ffffff" fill-opacity=".85" stroke="#5fe08a" stroke-width="1.5">
    <circle cx="14" cy="96" r="5"/><circle cx="10" cy="120" r="3.5"/><circle cx="188" cy="88" r="4.5"/><circle cx="192" cy="112" r="3"/><circle cx="100" cy="192" r="4"/>
  </g>
  <use href="#ptBottle" transform="translate(24 30)"/>
  <use href="#ptBottle" transform="translate(176 30) rotate(12)"/>
  <use href="#ptBottle" transform="translate(28 172) rotate(-10) scale(.85)"/>
  <use href="#ptBottle" transform="translate(172 172) rotate(8) scale(.85)"/>
</svg>
