<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 300 200" width="300" height="200">
  <!-- Heal Frame (mythic, hospital shop): light-yellow rim, a nurse cap on top, angel wings on both sides  (viewBox is 100 wider so the wings fit; the picture still sits at 29..171) -->
  <defs>
    <linearGradient id="haRim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe0"/><stop offset=".5" stop-color="#ffe680"/><stop offset="1" stop-color="#fff6c0"/></linearGradient>
    <g id="haWing">
      <path d="M0 0 C-14 -26 -40 -34 -58 -24 C-46 -20 -40 -14 -38 -8 C-50 -10 -60 -4 -64 6 C-52 4 -44 6 -40 12 C-50 16 -56 24 -56 34 C-44 26 -30 24 -18 26 C-10 18 -4 10 0 0 Z"
            fill="#fffdf2" stroke="#e8c860" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-8 4 C-20 -6 -34 -10 -48 -8 M-10 12 C-22 6 -36 6 -48 10 M-12 20 C-22 18 -32 20 -42 26" fill="none" stroke="#f0d890" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- wings -->
  <use href="#haWing" transform="translate(30 96)"/>
  <use href="#haWing" transform="translate(170 96) scale(-1 1)"/>
  <!-- halo glow rim -->
  <rect x="20" y="20" width="160" height="160" rx="28" fill="none" stroke="#fff8d0" stroke-width="16" opacity=".9"/>
  <rect x="20" y="20" width="160" height="160" rx="28" fill="none" stroke="url(#haRim)" stroke-width="10"/>
  <rect x="27" y="27" width="146" height="146" rx="22" fill="none" stroke="#fffef4" stroke-width="2"/>
  <g fill="#ffe680"><circle cx="20" cy="60" r="3"/><circle cx="20" cy="140" r="3"/><circle cx="180" cy="60" r="3"/><circle cx="180" cy="140" r="3"/></g>
  <!-- small hearts on the bottom rim -->
  <path d="M90 180 c-3 -4 -9 -2 -9 3 c0 4 9 9 9 9 c0 0 9 -5 9 -9 c0 -5 -6 -7 -9 -3 Z M114 180 c-2 -3 -6 -1.5 -6 2 c0 3 6 6 6 6 c0 0 6 -3 6 -6 c0 -3.5 -4 -5 -6 -2 Z" fill="#ff9ab4" stroke="#e86a8a" stroke-width="1.5"/>
  <!-- nurse cap with a pink cross -->
  <path d="M60 28 C62 9 82 2 100 2 C118 2 138 9 140 28 C126 21 112 19 100 19 C88 19 74 21 60 28 Z" fill="#ffffff" stroke="#e8c860" stroke-width="3" stroke-linejoin="round"/>
  <path d="M64 22 C78 16 122 16 136 22" fill="none" stroke="#ffe680" stroke-width="3"/>
  <g fill="#ff6a8a"><rect x="96" y="4" width="8" height="15" rx="1.5"/><rect x="92" y="7.5" width="16" height="8" rx="1.5"/></g>
</svg>
