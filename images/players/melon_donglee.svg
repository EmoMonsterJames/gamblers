  <ellipse cx="88" cy="132" rx="11" ry="6" fill="#ff9aa0" opacity=".6"/><ellipse cx="168" cy="132" rx="11" ry="6" fill="#ff9aa0" opacity=".6"/>
  <path d="M106 134 Q128 160 150 134 Z" fill="#c83a3a" stroke="#2a3a10" stroke-width="4" stroke-linejoin="round"/>
  <path d="M116 146 Q128 154 140 146" fill="#ff8a9a"/>
