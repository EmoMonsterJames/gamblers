  <path d="M128 52 C126 40 132 34 140 30" fill="none" stroke="#6a4a20" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 34 C150 26 162 32 158 42 C150 44 142 40 138 34 Z" fill="#78b840" stroke="#4a7a20" stroke-width="2"/>
