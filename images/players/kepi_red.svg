<circle cx="104" cy="150" r="9" fill="#6a3a1e"/><circle cx="152" cy="150" r="9" fill="#6a3a1e"/><circle cx="104" cy="150" r="4" fill="#1c1a1e"/><circle cx="152" cy="150" r="4" fill="#1c1a1e"/>
<circle cx="107" cy="147" r="2.4" fill="#fff"/><circle cx="155" cy="147" r="2.4" fill="#fff"/>
