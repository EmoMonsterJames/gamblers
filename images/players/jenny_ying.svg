  <ellipse cx="128" cy="114" rx="48" ry="54" fill="#f6dcc0" stroke="#8a6448" stroke-width="4"/>
  <!-- straight bangs with a side part -->
  <path d="M80 104 C78 64 104 48 132 48 C160 48 180 66 178 104 C168 92 160 76 152 70 C140 84 116 88 96 84 C90 90 84 96 80 104 Z" fill="#7a4c2c" stroke="#3a2210" stroke-width="3" stroke-linejoin="round"/>
  <path d="M132 50 C128 62 120 74 104 82" fill="none" stroke="#5a3418" stroke-width="2"/>
  <!-- glasses -->
  <rect x="88" y="106" width="34" height="26" rx="8" fill="#ffffff" fill-opacity=".35" stroke="#2a2a3a" stroke-width="4"/>
  <rect x="134" y="106" width="34" height="26" rx="8" fill="#ffffff" fill-opacity=".35" stroke="#2a2a3a" stroke-width="4"/>
  <path d="M122 116 Q128 112 134 116 M88 114 L80 112 M168 114 L176 112" fill="none" stroke="#2a2a3a" stroke-width="3"/>
  <!-- eyes -->
  <ellipse cx="105" cy="120" rx="5" ry="6" fill="#2a1a10"/><ellipse cx="151" cy="120" rx="5" ry="6" fill="#2a1a10"/>
  <circle cx="107" cy="118" r="1.8" fill="#fff"/><circle cx="153" cy="118" r="1.8" fill="#fff"/>
  <path d="M94 100 Q104 96 114 100 M142 100 Q152 96 162 100" fill="none" stroke="#5a3418" stroke-width="3" stroke-linecap="round"/>
