  <path d="M116 148 Q128 156 140 148" fill="none" stroke="#a04a3a" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="96" cy="140" rx="8" ry="4" fill="#f4a8a0" opacity=".5"/><ellipse cx="160" cy="140" rx="8" ry="4" fill="#f4a8a0" opacity=".5"/>
  <!-- simple hair tie bracelet on the wrist area -->
  <circle cx="62" cy="236" r="7" fill="none" stroke="#d05a7a" stroke-width="3"/>
