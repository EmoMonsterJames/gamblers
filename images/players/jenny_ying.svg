  <path d="M100 188 L128 256 L156 188 Q128 200 100 188 Z" fill="#f4f0e8" stroke="#4a5e72" stroke-width="3"/>
  <circle cx="114" cy="226" r="3" fill="#4a5e72"/><circle cx="142" cy="226" r="3" fill="#4a5e72"/>
