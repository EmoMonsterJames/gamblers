<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- #442 주식투자이모부 — a sturdy middle-aged man: blond hair with purple streaks, luxury sunglasses, a jacket,
     a scratch cut through one eyebrow, a fine handlebar mustache and a fancy cigar in the corner of his mouth -->
<defs>
<linearGradient id="lens" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a3a"/><stop offset="1" stop-color="#8a5ab8"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#e8b923"/><stop offset="1" stop-color="#a87a12"/></linearGradient>
<clipPath id="cc"><circle cx="128" cy="128" r="124"/></clipPath>
</defs>
<circle cx="128" cy="128" r="124" fill="#eaf8ee"/>
<!-- a stock chart going up -->
<path d="M20 170 L60 150 L84 160 L120 120 L150 132 L190 84 L236 60" fill="none" stroke="#3fae5a" stroke-width="5" stroke-linejoin="round" opacity=".45"/>
<path d="M226 52 L240 58 L232 72" fill="none" stroke="#3fae5a" stroke-width="5" stroke-linejoin="round" opacity=".45"/>
<g clip-path="url(#cc)">
<!-- broad shoulders in a navy jacket -->
<path d="M18 262 C22 214 62 188 100 182 L156 182 C194 188 234 214 238 262 Z" fill="#1f2f5a" stroke="#141a2e" stroke-width="4"/>
<path d="M106 184 L128 230 L150 184 Z" fill="#f7f7f5" stroke="#141a2e" stroke-width="2.4"/>
<path d="M122 196 L128 190 L134 196 L130 232 L128 236 L126 232 Z" fill="#8e5cf0" stroke="#3a2a54" stroke-width="2"/>
<path d="M100 182 L84 200 L112 236 L118 206 Z M156 182 L172 200 L144 236 L138 206 Z" fill="#2c4280" stroke="#141a2e" stroke-width="3" stroke-linejoin="round"/>
<circle cx="150" cy="244" r="3.4" fill="url(#gold)"/><path d="M60 214 h24" stroke="#f7f7f5" stroke-width="5" stroke-linecap="round"/><path d="M62 210 l6 -6 l6 6" fill="#e2463f" stroke="none"/>
<text x="186" y="228" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="14" fill="#3fae5a">▲ +27%</text>
<!-- neck + head (a sturdy square jaw) -->
<rect x="108" y="150" width="40" height="40" rx="12" fill="#f0c8a8" stroke="#7a4a30" stroke-width="4"/>
<path d="M70 104 C70 60 96 46 128 46 C160 46 186 60 186 104 C186 140 168 168 128 170 C88 168 70 140 70 104 Z" fill="#f6d0b0" stroke="#7a4a30" stroke-width="4"/>
<ellipse cx="70" cy="112" rx="7" ry="11" fill="#f6d0b0" stroke="#7a4a30" stroke-width="3"/><ellipse cx="186" cy="112" rx="7" ry="11" fill="#f6d0b0" stroke="#7a4a30" stroke-width="3"/>
<!-- blond slicked-back hair with purple streaks -->
<path d="M68 98 C60 40 104 26 132 28 C170 30 196 50 188 98 C180 72 160 60 128 60 C100 60 80 70 68 98 Z" fill="#f2cf5b" stroke="#9a7420" stroke-width="3.4" stroke-linejoin="round"/>
<path d="M92 40 C110 46 126 52 140 62 M150 34 C164 44 174 56 180 74" fill="none" stroke="#8e5cf0" stroke-width="7" stroke-linecap="round"/>
<path d="M78 72 C92 54 112 46 128 46 M136 44 C156 46 172 56 182 70" fill="none" stroke="#ffe9a0" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
<path d="M70 96 L72 116 M186 96 L184 116" stroke="#e0b448" stroke-width="5" stroke-linecap="round"/>
<!-- eyebrows: the left one has a scratch cut through it -->
<path d="M88 88 Q102 80 118 86" fill="none" stroke="#9a7420" stroke-width="6" stroke-linecap="round"/>
<path d="M98 76 L104 96 M104 76 L110 96" stroke="#f6d0b0" stroke-width="3.4" stroke-linecap="round"/>
<path d="M138 86 Q154 80 168 88" fill="none" stroke="#9a7420" stroke-width="6" stroke-linecap="round"/>
<!-- luxury sunglasses (gold frame, purple gradient lenses) -->
<path d="M84 98 H120 Q122 120 104 122 Q86 122 84 98 Z M136 98 H172 Q170 122 152 122 Q134 120 136 98 Z" fill="url(#lens)" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
<path d="M120 102 Q128 96 136 102 M84 100 L70 104 M172 100 L186 104" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
<path d="M92 104 l8 8 M144 104 l8 8" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
<!-- nose -->
<path d="M128 112 Q122 128 126 132 Q130 134 134 131" fill="none" stroke="#c08a6a" stroke-width="3" stroke-linecap="round"/>
<!-- handlebar mustache -->
<path d="M128 138 C118 132 104 134 98 142 C92 148 86 146 86 140 C86 136 90 134 92 138 C96 130 112 128 128 134 C144 128 160 130 164 138 C166 134 170 136 170 140 C170 146 164 148 158 142 C152 134 138 132 128 138 Z" fill="#c9a03a" stroke="#7a5a12" stroke-width="2.4" stroke-linejoin="round"/>
<!-- confident half smile + cigar in the right corner -->
<path d="M110 150 Q126 158 142 150" fill="none" stroke="#7a3a2a" stroke-width="3.4" stroke-linecap="round"/>
<g transform="rotate(-14 150 152)"><rect x="140" y="147" width="44" height="10" rx="4" fill="#7a4a24" stroke="#3a2010" stroke-width="2.4"/><rect x="156" y="147" width="8" height="10" fill="#e2463f" stroke="#3a2010" stroke-width="1.6"/><rect x="157.5" y="149" width="5" height="6" fill="url(#gold)"/><rect x="180" y="147" width="6" height="10" rx="2" fill="#f08a3c"/><circle cx="187" cy="152" r="2" fill="#ffd84a"/></g>
<path d="M196 136 C190 124 204 118 198 104 C194 94 206 88 202 76" fill="none" stroke="#c8ccd4" stroke-width="4" stroke-linecap="round" opacity=".8"/>
<!-- a gold chain watch on the jacket pocket -->
<path d="M52 230 Q66 244 82 232" fill="none" stroke="url(#gold)" stroke-width="3"/>
</g>
</svg>
