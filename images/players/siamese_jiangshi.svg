<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- #512 샴강시 — jiangshi siamese twins: two pale-green faces joined at the cheek on one Qing-robe body.
     Left = jiangshi hat, light pink pupils · right = a yellow talisman stuck on the forehead, light yellow pupils. No fangs. -->
<defs>
<linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3f8f"/><stop offset="1" stop-color="#16214f"/></linearGradient>
<linearGradient id="tal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset="1" stop-color="#f2d24a"/></linearGradient>
<radialGradient id="mist" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#3d5a4a"/><stop offset="1" stop-color="#14201c"/></radialGradient>
<clipPath id="cc"><circle cx="128" cy="128" r="124"/></clipPath>
</defs>
<circle cx="128" cy="128" r="124" fill="url(#mist)"/>
<g clip-path="url(#cc)">
<!-- moon + fog -->
<circle cx="206" cy="52" r="18" fill="#f4f1d0" opacity=".85"/>
<path d="M0 200 Q40 188 80 198 T160 196 T256 192 V256 H0Z" fill="#9fc4b0" opacity=".18"/>
<!-- stiff arms stretched forward (the hopping pose) -->
<path d="M70 178 L28 160" stroke="#3a2a24" stroke-width="26" stroke-linecap="round"/>
<path d="M70 178 L28 160" stroke="url(#robe)" stroke-width="20" stroke-linecap="round"/>
<path d="M186 178 L228 160" stroke="#3a2a24" stroke-width="26" stroke-linecap="round"/>
<path d="M186 178 L228 160" stroke="url(#robe)" stroke-width="20" stroke-linecap="round"/>
<path d="M36 151 l-10 -4 M36 169 l-10 -4" stroke="#d8a83a" stroke-width="4"/>
<path d="M220 151 l10 -4 M220 169 l10 -4" stroke="#d8a83a" stroke-width="4"/>
<g fill="#b7d9c2" stroke="#3a2a24" stroke-width="3.2" stroke-linejoin="round">
<path d="M22 152 l-14 -2 q-4 4 0 7 l14 1 q-14 2 -14 6 q0 4 14 2Z"/>
<path d="M234 152 l14 -2 q4 4 0 7 l-14 1 q14 2 14 6 q0 4 -14 2Z"/>
</g>
<!-- one robe body -->
<path d="M52 262 C54 214 70 186 98 176 Q128 168 158 176 C186 186 202 214 204 262Z" fill="url(#robe)" stroke="#3a2a24" stroke-width="4"/>
<path d="M128 176 V262" stroke="#d8a83a" stroke-width="5"/>
<path d="M100 176 Q128 192 156 176" fill="none" stroke="#d8a83a" stroke-width="5"/>
<rect x="114" y="170" width="28" height="10" rx="4" fill="#16214f" stroke="#d8a83a" stroke-width="2.5"/>
<g fill="#d8a83a"><circle cx="128" cy="200" r="3"/><circle cx="128" cy="218" r="3"/><circle cx="128" cy="236" r="3"/></g>
<!-- 寿 patch -->
<circle cx="128" cy="214" r="0" fill="none"/>
<path d="M82 214 q10 -6 20 0 q-10 6 -20 0Z M154 214 q10 -6 20 0 q-10 6 -20 0Z" fill="#d8a83a" opacity=".8"/>
<!-- the two heads: one shared neck, faces touching at the cheek -->
<rect x="110" y="152" width="36" height="22" rx="8" fill="#b7d9c2" stroke="#3a2a24" stroke-width="3.5"/>
<!-- left head -->
<g transform="translate(90 112)">
<ellipse cx="0" cy="0" rx="40" ry="42" fill="#b7d9c2" stroke="#3a2a24" stroke-width="4"/>
<path d="M-26 -16 q-6 18 0 36 M-30 6 q6 4 10 0" fill="none" stroke="#8fb8a0" stroke-width="2"/>
<!-- jiangshi hat (Qing official cap) -->
<path d="M-46 -24 Q0 -40 46 -24 L42 -14 Q0 -28 -42 -14Z" fill="#1a1a22" stroke="#3a2a24" stroke-width="3"/>
<path d="M-36 -22 Q-36 -62 0 -62 Q36 -62 36 -22Z" fill="#26262e" stroke="#3a2a24" stroke-width="3.2"/>
<path d="M-30 -40 Q0 -48 30 -40" fill="none" stroke="#b91c1c" stroke-width="4"/>
<circle cx="0" cy="-66" r="7" fill="#e11d2e" stroke="#3a2a24" stroke-width="2.6"/>
<path d="M-4 -60 L-14 -36 M4 -60 L14 -36 M0 -59 V-36" stroke="#e11d2e" stroke-width="2" opacity=".85"/>
<!-- eyes: light pink pupils, dark eye bags -->
<path d="M-26 4 q8 6 16 0 M8 4 q8 6 16 0" fill="none" stroke="#6b8f7a" stroke-width="2.2"/>
<ellipse cx="-17" cy="-4" rx="10" ry="9" fill="#f7fbf8" stroke="#3a2a24" stroke-width="2.6"/>
<ellipse cx="16" cy="-4" rx="10" ry="9" fill="#f7fbf8" stroke="#3a2a24" stroke-width="2.6"/>
<circle cx="-17" cy="-3" r="5.6" fill="#ffb6d9"/><circle cx="16" cy="-3" r="5.6" fill="#ffb6d9"/>
<circle cx="-17" cy="-3" r="2.2" fill="#c2578b"/><circle cx="16" cy="-3" r="2.2" fill="#c2578b"/>
<circle cx="-15" cy="-6" r="1.5" fill="#fff"/><circle cx="18" cy="-6" r="1.5" fill="#fff"/>
<path d="M-28 -16 l14 3 M28 -16 l-14 3" stroke="#3a2a24" stroke-width="3" stroke-linecap="round"/>
<!-- small stiff mouth, no fangs -->
<path d="M-9 22 q9 -3 18 0" fill="none" stroke="#3a2a24" stroke-width="3" stroke-linecap="round"/>
<circle cx="-26" cy="14" r="6" fill="#7aa58b" opacity=".35"/>
</g>
<!-- right head -->
<g transform="translate(166 116)">
<ellipse cx="0" cy="0" rx="38" ry="40" fill="#b7d9c2" stroke="#3a2a24" stroke-width="4"/>
<!-- black hair band on top -->
<path d="M-36 -14 Q-34 -42 0 -42 Q34 -42 36 -14 Q20 -28 0 -28 Q-20 -28 -36 -14Z" fill="#1c1a1e" stroke="#3a2a24" stroke-width="3"/>
<!-- eyes: light yellow pupils -->
<path d="M-24 6 q8 6 16 0 M8 6 q8 6 16 0" fill="none" stroke="#6b8f7a" stroke-width="2.2"/>
<ellipse cx="-16" cy="-2" rx="9.5" ry="8.5" fill="#f7fbf8" stroke="#3a2a24" stroke-width="2.6"/>
<ellipse cx="16" cy="-2" rx="9.5" ry="8.5" fill="#f7fbf8" stroke="#3a2a24" stroke-width="2.6"/>
<circle cx="-16" cy="-1" r="5.4" fill="#fff27a"/><circle cx="16" cy="-1" r="5.4" fill="#fff27a"/>
<circle cx="-16" cy="-1" r="2.1" fill="#b39100"/><circle cx="16" cy="-1" r="2.1" fill="#b39100"/>
<circle cx="-14" cy="-4" r="1.4" fill="#fff"/><circle cx="18" cy="-4" r="1.4" fill="#fff"/>
<path d="M-6 24 q6 3 12 0" fill="none" stroke="#3a2a24" stroke-width="3" stroke-linecap="round"/>
<circle cx="26" cy="16" r="6" fill="#7aa58b" opacity=".35"/>
<!-- yellow talisman (부적) stuck on the forehead, hanging over the face -->
<g transform="rotate(-6)">
<path d="M-9 -50 H9 L10 -13 Q0 -10 -10 -13Z" fill="url(#tal)" stroke="#a8861a" stroke-width="2"/>
<path d="M0 -46 V-16 M-5 -42 H5 M-5 -34 q5 -4 10 0 M-6 -26 h12 M-4 -22 l8 6 M4 -22 l-8 6" fill="none" stroke="#c8102e" stroke-width="2" stroke-linecap="round"/>
</g>
</g>
</g>
<circle cx="128" cy="128" r="124" fill="none" stroke="#3a2a24" stroke-width="4"/>
</svg>
