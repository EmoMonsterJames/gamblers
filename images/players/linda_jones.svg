<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- #275 린다존스 — born Human, had surgery to become a Dungi: rabbit shape with 몽이주름 and no hair, but it came out a bit off
     (mismatched ears, a band-aid, stitch marks). Heavy make-up, piles of accessories, a sulky face, a dress covered in LUX logos. -->
<defs>
<clipPath id="cc"><circle cx="128" cy="128" r="124"/></clipPath>
<pattern id="lux" width="44" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)"><rect width="44" height="26" fill="#3b1d5a"/><text x="2" y="10" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="9" letter-spacing="1" fill="#f0c75e">LUX</text><text x="24" y="23" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="9" letter-spacing="1" fill="#f0c75e">LUX</text></pattern>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#e8b923"/><stop offset="1" stop-color="#a87a12"/></linearGradient>
</defs>
<circle cx="128" cy="128" r="124" fill="#f6e3ff"/>
<g fill="#d8b4fe" opacity=".7"><path d="M34 74 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/><path d="M216 168 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2 Z"/></g>
<g clip-path="url(#cc)">
<!-- LUX-logo dress -->
<path d="M26 262 C32 220 64 196 100 188 L156 188 C192 196 224 220 230 262 Z" fill="url(#lux)" stroke="#3a2a24" stroke-width="4"/>
<path d="M100 188 Q128 212 156 188 Z" fill="#e9b48f" stroke="#3a2a24" stroke-width="3"/>
<path d="M58 222 Q128 238 198 222" fill="none" stroke="#f0c75e" stroke-width="3"/>
<!-- necklaces: pearls · gold chain · a big pendant -->
<g fill="#fffbe8" stroke="#c9b48a" stroke-width="1"><circle cx="104" cy="196" r="3.2"/><circle cx="110" cy="202" r="3.2"/><circle cx="117" cy="206" r="3.2"/><circle cx="124" cy="208" r="3.2"/><circle cx="132" cy="208" r="3.2"/><circle cx="139" cy="206" r="3.2"/><circle cx="146" cy="202" r="3.2"/><circle cx="152" cy="196" r="3.2"/></g>
<path d="M96 192 Q128 232 160 192" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-dasharray="4 2"/>
<path d="M128 214 l9 9 l-9 13 l-9 -13 Z" fill="#ff4f8b" stroke="#a87a12" stroke-width="2.5"/>
<!-- ears: one upright, one bent the wrong way (with a band-aid) -->
<ellipse cx="98" cy="34" rx="14" ry="40" transform="rotate(-12 98 72)" fill="#e9b48f" stroke="#3a2a24" stroke-width="4"/>
<ellipse cx="98" cy="38" rx="6.5" ry="29" transform="rotate(-12 98 72)" fill="#ffb8cf"/>
<path d="M150 74 C144 46 150 22 166 18 C180 15 190 26 184 36 C200 42 206 58 194 64 C184 68 174 60 170 50 C168 60 166 68 162 76 Z" fill="#e9b48f" stroke="#3a2a24" stroke-width="4" stroke-linejoin="round"/>
<path d="M158 66 C156 46 160 30 168 28 C176 27 178 34 172 40" fill="none" stroke="#ffb8cf" stroke-width="6" stroke-linecap="round"/>
<g transform="rotate(32 184 46)"><rect x="172" y="40" width="24" height="10" rx="4" fill="#f5d0a9" stroke="#b9875a" stroke-width="1.5"/><circle cx="181" cy="45" r=".9" fill="#b9875a"/><circle cx="187" cy="45" r=".9" fill="#b9875a"/></g>
<!-- head (no hair) -->
<ellipse cx="128" cy="120" rx="62" ry="56" fill="#e9b48f" stroke="#3a2a24" stroke-width="4"/>
<!-- surgery stitches along the ear seams -->
<path d="M100 72 l8 4 M104 68 l-2 10 M150 70 l8 -2 M154 66 l2 10" stroke="#9a5a4a" stroke-width="2" stroke-linecap="round"/>
<!-- a tiara where the hair used to be -->
<path d="M100 72 L108 58 L116 68 L128 52 L140 68 L148 58 L156 72 Q128 66 100 72 Z" fill="url(#gold)" stroke="#a87a12" stroke-width="2"/>
<circle cx="128" cy="60" r="3.5" fill="#7ad7ff" stroke="#fff" stroke-width="1"/><circle cx="110" cy="64" r="2.2" fill="#ff4f8b"/><circle cx="146" cy="64" r="2.2" fill="#ff4f8b"/>
<!-- heavy make-up: blue eyeshadow, thick liner and lashes, big blush -->
<ellipse cx="103" cy="108" rx="17" ry="11" fill="#5b8cff" opacity=".55"/><ellipse cx="153" cy="108" rx="15" ry="10" fill="#5b8cff" opacity=".55"/>
<ellipse cx="90" cy="134" rx="15" ry="8" fill="#ff3f7a" opacity=".5"/><ellipse cx="166" cy="134" rx="15" ry="8" fill="#ff3f7a" opacity=".5"/>
<ellipse cx="104" cy="115" rx="12" ry="11" fill="#fff" stroke="#1a1a22" stroke-width="3"/><circle cx="106" cy="117" r="6.5" fill="#3a2a1e"/><circle cx="108" cy="114" r="2.2" fill="#fff"/>
<ellipse cx="152" cy="116" rx="10" ry="9" fill="#fff" stroke="#1a1a22" stroke-width="3"/><circle cx="150" cy="118" r="5.5" fill="#3a2a1e"/><circle cx="152" cy="115" r="2" fill="#fff"/>
<path d="M90 110 l-7 -4 M93 105 l-5 -6 M98 102 l-2 -7 M166 111 l7 -4 M163 106 l5 -6 M158 103 l2 -7" stroke="#1a1a22" stroke-width="2.6" stroke-linecap="round"/>
<!-- sulky brows (pulled down towards the middle) -->
<path d="M88 94 Q100 92 116 100" fill="none" stroke="#3a2a24" stroke-width="4.5" stroke-linecap="round"/><path d="M168 95 Q156 93 140 101" fill="none" stroke="#3a2a24" stroke-width="4.5" stroke-linecap="round"/>
<!-- nose · 몽이주름 · over-drawn red lips turned down -->
<path d="M124 132 h8 l-4 5 Z" fill="#ff8fa8" stroke="#3a2a24" stroke-width="1.2"/>
<path d="M106 136 Q98 149 106 162 M150 136 Q158 149 150 162" fill="none" stroke="#3a2a24" stroke-width="3.5" stroke-linecap="round"/>
<path d="M111 154 Q120 144 128 147 Q136 144 145 154 Q128 160 111 154 Z" fill="#d81b3c" stroke="#8e0f26" stroke-width="1.5"/>
<path d="M116 153 Q128 151 140 153" fill="none" stroke="#8e0f26" stroke-width="1.5"/>
<!-- grumpy vein mark -->
<path d="M170 82 q4 -6 8 0 M174 78 q6 4 0 8 M178 86 q-4 6 -8 0" fill="none" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>
<!-- big gold hoops + drop pearls -->
<circle cx="68" cy="150" r="11" fill="none" stroke="url(#gold)" stroke-width="4.5"/><circle cx="188" cy="150" r="11" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
<circle cx="68" cy="163" r="3.5" fill="#fffbe8" stroke="#c9b48a"/><circle cx="188" cy="163" r="3.5" fill="#fffbe8" stroke="#c9b48a"/>
</g>
</svg>
