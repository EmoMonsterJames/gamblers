<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- #454 흰둥이 — (reference image 5) a white fluffy puppy: a round curly head with long floppy ears sticking out to the sides,
     small dot eyes, a tiny wavy nose line and a big open happy mouth — on an ordinary (not muscly) man's body, curly white fur all over -->
<defs>
<pattern id="fzp" width="11" height="10" patternUnits="userSpaceOnUse"><path d="M1.5 5.5c.6 -3 4.6 -3.2 4.8 -.2c.1 2 -2.6 2.4 -2.8 .6" fill="none" stroke="#d6d0c8" stroke-width="1.1" stroke-linecap="round"/><path d="M6.8 9.4c.4 -2.2 3.4 -2.4 3.6 -.2" fill="none" stroke="#e8e3dc" stroke-width="1" stroke-linecap="round"/><path d="M7 2c.3 -1.6 2.6 -1.8 2.8 0" fill="none" stroke="#d6d0c8" stroke-width=".9" stroke-linecap="round"/></pattern>
<radialGradient id="glow" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fffbd0"/><stop offset="1" stop-color="#ffe37a"/></radialGradient>
<clipPath id="cc"><circle cx="128" cy="128" r="124"/></clipPath>
</defs>
<circle cx="128" cy="128" r="124" fill="url(#glow)"/>
<g fill="#ffffff" opacity=".9"><path d="M36 70 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/><path d="M214 60 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2 Z"/><path d="M220 170 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/><path d="M34 176 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/></g>
<g clip-path="url(#cc)">
