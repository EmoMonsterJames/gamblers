<path d="M104 222 Q114 228 124 222 M132 222 Q142 228 152 222 M128 244 q-2 3 0 5" fill="none" stroke="#c8c0b8" stroke-width="2" stroke-linecap="round"/>
<!-- long floppy ears sticking out sideways -->
