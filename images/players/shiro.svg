<path d="M78 270 C78 226 92 196 128 192 C164 196 178 226 178 270 Z" fill="#ffffff" stroke="#3a2a24" stroke-width="10" stroke-dasharray="0 9" stroke-linecap="round"/>
<path d="M78 270 C78 226 92 196 128 192 C164 196 178 226 178 270 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6.6" stroke-dasharray="0 9" stroke-linecap="round"/>
