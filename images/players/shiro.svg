<ellipse cx="110" cy="112" rx="3.4" ry="5.4" fill="#1c1a1e"/><ellipse cx="146" cy="112" rx="3.4" ry="5.4" fill="#1c1a1e"/>
<path d="M118 128 q3 -4 6 0 q4 4 8 0 q3 -4 6 0" fill="none" stroke="#1c1a1e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
