<!-- round curly head -->
<ellipse cx="128" cy="118" rx="56" ry="60" fill="#ffffff" stroke="#3a2a24" stroke-width="11" stroke-dasharray="0 9" stroke-linecap="round"/>
<ellipse cx="128" cy="118" rx="56" ry="60" fill="#ffffff" stroke="#ffffff" stroke-width="7.4" stroke-dasharray="0 9" stroke-linecap="round"/>
