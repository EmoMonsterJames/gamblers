<path d="M86 96 C60 86 30 92 24 108 C20 122 40 126 60 120 C72 116 84 112 92 112 Z M170 96 C196 86 226 92 232 108 C236 122 216 126 196 120 C184 116 172 112 164 112 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6.6" stroke-dasharray="0 8" stroke-linecap="round"/>
