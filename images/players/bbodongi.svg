<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Congzzi · Dungi (female) · Young Adult — white, chubby, small ears, one big + one small dot eye, flashy CEO, LUX bag;
       glamorous low-cut dress, big hoop earrings, diamond necklace -->
