  <g transform="translate(14 -2) scale(.89)">
  <!-- small ears -->
  <g fill="#ffffff" stroke="#8a7a6a" stroke-width="4" stroke-linejoin="round">
    <path d="M90 74 C84 46 92 34 102 36 C112 38 112 56 108 74 Z"/><path d="M166 74 C172 46 164 34 154 36 C144 38 144 56 148 74 Z"/></g>
  <path d="M94 68 C90 50 96 44 101 45 C106 46 106 58 104 68 Z M162 68 C166 50 160 44 155 45 C150 46 150 58 152 68 Z" fill="#ffc8d8"/>
  </g>
  <!-- bare shoulders + full chest -->
  <path d="M26 256 C28 212 62 188 100 184 L156 184 C194 188 228 212 230 256 Z" fill="#ffffff" stroke="#8a7a6a" stroke-width="4"/>
  <path d="M86 226 C92 206 116 202 127 220 M129 220 C140 202 164 206 170 226" fill="none" stroke="#c8b8a8" stroke-width="3" stroke-linecap="round"/>
