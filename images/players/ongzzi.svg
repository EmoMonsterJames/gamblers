<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Ongzzi · Rat (female, white hamster) · Young Adult — Mongi wrinkle mouth, smiling eyes, flashy earrings, sparkly dress -->
  <defs>
    <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ac8"/><stop offset=".5" stop-color="#c04ae0"/><stop offset="1" stop-color="#6a3ae0"/></linearGradient>
    <radialGradient id="fur" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ece6f0"/></radialGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="#fbeaf4"/>
  <!-- sparkly dress (off-shoulder) -->
  <path d="M34 256 C38 206 78 186 128 186 C178 186 218 206 222 256 Z" fill="url(#dress)" stroke="#5a1a7a" stroke-width="4"/>
  <path d="M70 200 C96 214 160 214 186 200" fill="none" stroke="#ffd6f2" stroke-width="5"/>
  <g fill="#fff"><path d="M70 228 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 Z"/><path d="M150 236 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/><path d="M188 222 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/><path d="M110 246 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 Z"/></g>
  <g fill="#ffe680"><circle cx="96" cy="216" r="2.5"/><circle cx="128" cy="226" r="2.5"/><circle cx="170" cy="214" r="2.5"/><circle cx="58" cy="244" r="2.5"/><circle cx="200" cy="246" r="2.5"/></g>
  <!-- chubby white hamster head + body (no separate neck, hamster-round) -->
  <ellipse cx="128" cy="124" rx="76" ry="68" fill="url(#fur)" stroke="#8a7a90" stroke-width="4"/>
  <!-- round ears -->
  <circle cx="72" cy="66" r="22" fill="url(#fur)" stroke="#8a7a90" stroke-width="4"/><circle cx="72" cy="66" r="12" fill="#ffc4d8"/>
  <circle cx="184" cy="66" r="22" fill="url(#fur)" stroke="#8a7a90" stroke-width="4"/><circle cx="184" cy="66" r="12" fill="#ffc4d8"/>
  <!-- ribbon on an ear -->
  <path d="M190 48 l-14 -12 l2 18 Z M190 48 l14 -12 l-2 18 Z" fill="#ff4aa0" stroke="#9a1a5a" stroke-width="2"/><circle cx="190" cy="48" r="4" fill="#ff4aa0" stroke="#9a1a5a" stroke-width="2"/>
  <!-- chubby cheeks -->
  <ellipse cx="80" cy="140" rx="22" ry="18" fill="#fff" stroke="#e2d6e8" stroke-width="2"/><ellipse cx="176" cy="140" rx="22" ry="18" fill="#fff" stroke="#e2d6e8" stroke-width="2"/>
  <ellipse cx="82" cy="138" rx="12" ry="7" fill="#ffaccc" opacity=".8"/><ellipse cx="174" cy="138" rx="12" ry="7" fill="#ffaccc" opacity=".8"/>
  <!-- smiling eyes (^ ^) with lashes -->
  <path d="M90 116 Q104 100 118 116" fill="none" stroke="#2a1a2a" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 116 Q152 100 166 116" fill="none" stroke="#2a1a2a" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 116 l-6 -4 M166 116 l6 -4 M93 110 l-6 -6 M163 110 l6 -6" stroke="#2a1a2a" stroke-width="3" stroke-linecap="round"/>
  <!-- Mongi wrinkle: two bracket arcs around a small smiling mouth "( ‿ )" -->
  <path d="M110 136 Q102 148 110 160" fill="none" stroke="#9a7a9a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M146 136 Q154 148 146 160" fill="none" stroke="#9a7a9a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M118 146 Q128 156 138 146" fill="none" stroke="#7a2a4a" stroke-width="4" stroke-linecap="round"/>
  <!-- flashy chandelier earrings -->
  <g stroke="#b8860b" stroke-width="2">
    <circle cx="58" cy="152" r="4" fill="#ffd700"/><path d="M58 156 L58 166" /><path d="M50 166 L66 166 L58 186 Z" fill="#ff4aa0"/><circle cx="58" cy="190" r="5" fill="#7ae0ff"/>
    <circle cx="198" cy="152" r="4" fill="#ffd700"/><path d="M198 156 L198 166"/><path d="M190 166 L206 166 L198 186 Z" fill="#ff4aa0"/><circle cx="198" cy="190" r="5" fill="#7ae0ff"/>
  </g>
  <path d="M58 182 l-6 -2 M198 182 l6 -2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- tiny paws at the dress -->
  <ellipse cx="96" cy="196" rx="12" ry="9" fill="#fff" stroke="#8a7a90" stroke-width="3"/><ellipse cx="160" cy="196" rx="12" ry="9" fill="#fff" stroke="#8a7a90" stroke-width="3"/>
  <!-- sparkles around -->
  <path d="M30 96 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z M222 106 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z" fill="#ffd36a"/>
</svg>
