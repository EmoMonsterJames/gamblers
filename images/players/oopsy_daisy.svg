<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- #498 웁시데이지 — a bald baby doll: big round head, rosy cheeks, glossy doll eyes, blue dress with a white lace collar and hem -->
<defs>
