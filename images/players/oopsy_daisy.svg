<radialGradient id="iris" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#2a5fae"/></radialGradient>
<clipPath id="cc"><circle cx="128" cy="128" r="124"/></clipPath>
</defs>
<circle cx="128" cy="128" r="124" fill="#ffeef5"/>
