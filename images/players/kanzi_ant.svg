<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- #285 간지나는개미 — drawn in the Dark Ant / Black Ant style (round dark head, curved ball antennae, thin neck, shirt body):
     the cool one — sunglasses, a smirk, a leather jacket and a gold chain -->
<defs>
<clipPath id="cc"><circle cx="128" cy="128" r="124"/></clipPath>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#e8b923"/><stop offset="1" stop-color="#a87a12"/></linearGradient>
<linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b5563"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
</defs>
<circle cx="128" cy="128" r="124" fill="#fde68a"/>
<g clip-path="url(#cc)">
<!-- leather jacket over a white tee -->
<path d="M36 262 C40 220 72 196 104 190 L152 190 C184 196 216 220 220 262 Z" fill="#1f2937" stroke="#111" stroke-width="4"/>
<path d="M104 190 L116 262 H140 L152 190 Z" fill="#f8fafc" stroke="#111" stroke-width="3"/>
<path d="M104 190 L96 226 L116 238 M152 190 L160 226 L140 238" fill="none" stroke="#4b5563" stroke-width="3" stroke-linejoin="round"/>
<path d="M98 196 Q128 236 158 196" fill="none" stroke="url(#gold)" stroke-width="5" stroke-dasharray="6 3"/>
<!-- thin neck segment -->
<ellipse cx="128" cy="174" rx="14" ry="18" fill="#2b1d16" stroke="#111" stroke-width="3"/>
<!-- curved antennae with balls -->
<path d="M106 76 C96 50 78 34 60 30" fill="none" stroke="#2b1d16" stroke-width="5" stroke-linecap="round"/>
<path d="M150 76 C160 50 178 34 196 30" fill="none" stroke="#2b1d16" stroke-width="5" stroke-linecap="round"/>
<circle cx="58" cy="30" r="8" fill="#2b1d16" stroke="#111" stroke-width="2.5"/><circle cx="198" cy="30" r="8" fill="#2b1d16" stroke="#111" stroke-width="2.5"/>
<!-- head -->
<ellipse cx="128" cy="112" rx="56" ry="52" fill="#2b1d16" stroke="#111" stroke-width="4"/>
<ellipse cx="108" cy="84" rx="18" ry="8" fill="#fff" opacity=".18" transform="rotate(-20 108 84)"/>
<!-- sunglasses -->
<path d="M76 104 H180" stroke="#111" stroke-width="4"/>
<path d="M80 102 H122 Q122 128 102 128 Q80 128 80 102 Z" fill="url(#lens)" stroke="#e8b923" stroke-width="3" stroke-linejoin="round"/>
<path d="M134 102 H176 Q176 128 154 128 Q134 128 134 102 Z" fill="url(#lens)" stroke="#e8b923" stroke-width="3" stroke-linejoin="round"/>
<path d="M88 108 l10 -4 M142 108 l10 -4" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
<!-- mandibles + smirk -->
<path d="M112 146 Q108 156 116 160 M144 146 Q148 156 140 160" fill="none" stroke="#5a3a28" stroke-width="3.5" stroke-linecap="round"/>
<path d="M114 144 Q130 150 144 138" fill="none" stroke="#f5e6d8" stroke-width="3.5" stroke-linecap="round"/>
<!-- sparkle -->
<path d="M208 84 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z" fill="#fff"/>
</g>
</svg>
