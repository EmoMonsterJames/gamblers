<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- #444 샴쌍덩이 — grey Dungi siamese twins: two rabbit heads on one body.
     Left = the older sister (bigger head, lively, full makeup and a bow) · right = the younger one (smaller, expressionless, just staring).
     Both have 몽이주름. The outfit is the sister's taste: a glamorous sequin gown on a curvy figure. -->
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#e8b923"/><stop offset="1" stop-color="#a87a12"/></linearGradient>
<linearGradient id="gown" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fa3"/><stop offset="1" stop-color="#9b1d63"/></linearGradient>
<clipPath id="cc"><circle cx="128" cy="128" r="124"/></clipPath>
</defs>
<circle cx="128" cy="128" r="124" fill="#2a1a3a"/>
<g fill="#ffd34d"><path d="M28 90 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/><path d="M226 120 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2 Z"/><path d="M200 34 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/></g>
<g clip-path="url(#cc)">
<!-- one curvy body in a sequin gown (sweetheart neckline) -->
<path d="M40 262 C44 226 60 206 84 198 Q128 186 172 198 C196 206 212 226 216 262 Z" fill="#9aa3ad" stroke="#3a2a24" stroke-width="4"/>
<path d="M70 262 C70 236 76 222 86 214 Q100 206 112 214 Q128 224 144 214 Q156 206 170 214 C180 222 186 236 186 262 Z" fill="url(#gown)" stroke="#3a2a24" stroke-width="3.4" stroke-linejoin="round"/>
<g fill="#ffe0f2" opacity=".9"><circle cx="96" cy="230" r="2.2"/><circle cx="110" cy="244" r="2.2"/><circle cx="124" cy="232" r="2.2"/><circle cx="140" cy="246" r="2.2"/><circle cx="154" cy="230" r="2.2"/><circle cx="168" cy="244" r="2.2"/><circle cx="84" cy="246" r="2.2"/><circle cx="132" cy="256" r="2.2"/></g>
<path d="M98 214 Q112 222 128 224 Q144 222 158 214" fill="none" stroke="#3a2a24" stroke-width="2" opacity=".4"/>
<path d="M76 214 Q96 236 128 238 Q160 236 180 214" fill="none" stroke="url(#gold)" stroke-width="3"/>
<path d="M128 238 l5 6 l-5 8 l-5 -8 Z" fill="#7ad7ff" stroke="#ffffff" stroke-width="1"/>
<!-- two necks joining the one body -->
<path d="M70 190 Q86 168 102 176 L108 202 Q88 206 70 190 Z" fill="#9aa3ad" stroke="#3a2a24" stroke-width="3.4" stroke-linejoin="round"/>
<path d="M186 192 Q172 174 158 180 L150 202 Q170 206 186 192 Z" fill="#9aa3ad" stroke="#3a2a24" stroke-width="3.4" stroke-linejoin="round"/>
<!-- ===== younger sister (right, smaller) ===== -->
<g transform="rotate(8 176 76)"><ellipse cx="164" cy="40" rx="9" ry="24" fill="#9aa3ad" stroke="#3a2a24" stroke-width="3.4"/><ellipse cx="164" cy="42" rx="4" ry="17" fill="#ffb8cf"/><ellipse cx="192" cy="44" rx="9" ry="24" fill="#9aa3ad" stroke="#3a2a24" stroke-width="3.4"/><ellipse cx="192" cy="46" rx="4" ry="17" fill="#ffb8cf"/></g>
<ellipse cx="178" cy="132" rx="44" ry="40" fill="#9aa3ad" stroke="#3a2a24" stroke-width="4"/>
<circle cx="164" cy="126" r="4.6" fill="#1c1a1e"/><circle cx="192" cy="126" r="4.6" fill="#1c1a1e"/>
<path d="M156 114 H172 M184 114 H200" stroke="#3a2a24" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
<path d="M174 138 h8 l-4 4 Z" fill="#ff8fa8" stroke="#3a2a24" stroke-width="1.2"/>
<path d="M170 152 H186" stroke="#3a2a24" stroke-width="3" stroke-linecap="round"/>
<path d="M164 142 Q158 152 164 162 M192 142 Q198 152 192 162" fill="none" stroke="#3a2a24" stroke-width="2.8" stroke-linecap="round"/>
