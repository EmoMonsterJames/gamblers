<!-- eyeshadow + lashes + sparkly eyes (lively) -->
<ellipse cx="66" cy="104" rx="14" ry="10" fill="#c77dff" opacity=".55"/><ellipse cx="106" cy="104" rx="14" ry="10" fill="#c77dff" opacity=".55"/>
<ellipse cx="66" cy="110" rx="10" ry="12" fill="#1c1a1e"/><circle cx="69" cy="106" r="3.6" fill="#fff"/><circle cx="63" cy="115" r="1.6" fill="#fff"/>
<ellipse cx="106" cy="110" rx="10" ry="12" fill="#1c1a1e"/><circle cx="109" cy="106" r="3.6" fill="#fff"/><circle cx="103" cy="115" r="1.6" fill="#fff"/>
<path d="M56 102 l-7 -6 M60 98 l-4 -8 M116 102 l7 -6 M112 98 l4 -8" stroke="#1c1a1e" stroke-width="3" stroke-linecap="round"/>
<path d="M54 90 Q66 82 78 90 M94 90 Q106 82 118 90" fill="none" stroke="#3a2a24" stroke-width="3.2" stroke-linecap="round"/>
<ellipse cx="54" cy="132" rx="11" ry="6.5" fill="#ff4f8b" opacity=".55"/><ellipse cx="118" cy="132" rx="11" ry="6.5" fill="#ff4f8b" opacity=".55"/>
<path d="M82 124 h8 l-4 5 Z" fill="#ff8fa8" stroke="#3a2a24" stroke-width="1.2"/>
<!-- wide red-lipstick laugh -->
<path d="M70 136 Q86 158 102 136 Q86 142 70 136 Z" fill="#d81b60" stroke="#4a1a1a" stroke-width="2.6" stroke-linejoin="round"/><path d="M78 140 q8 6 16 0" fill="#ffffff" opacity=".9"/>
<path d="M64 128 Q56 142 64 156 M108 128 Q116 142 108 156" fill="none" stroke="#3a2a24" stroke-width="3.4" stroke-linecap="round"/>
<path d="M60 120 l1.4 -3.6 l1.4 3.6 l3.6 1.4 l-3.6 1.4 l-1.4 3.6 l-1.4 -3.6 l-3.6 -1.4 Z" fill="#fff"/>
<!-- the sister's long earrings + necklace on the body -->
<path d="M30 124 v14 M142 124 v14" stroke="url(#gold)" stroke-width="2.4"/><circle cx="30" cy="142" r="4.4" fill="#7ad7ff" stroke="#ffffff" stroke-width="1"/><circle cx="142" cy="142" r="4.4" fill="#7ad7ff" stroke="#ffffff" stroke-width="1"/>
</g>
</svg>
