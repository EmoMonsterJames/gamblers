<g transform="rotate(-10 84 70)"><ellipse cx="62" cy="22" rx="12" ry="32" fill="#9aa3ad" stroke="#3a2a24" stroke-width="4"/><ellipse cx="62" cy="25" rx="5.4" ry="24" fill="#ffb8cf"/><ellipse cx="102" cy="22" rx="12" ry="32" fill="#9aa3ad" stroke="#3a2a24" stroke-width="4"/><ellipse cx="102" cy="25" rx="5.4" ry="24" fill="#ffb8cf"/></g>
<ellipse cx="86" cy="116" rx="58" ry="54" fill="#9aa3ad" stroke="#3a2a24" stroke-width="4"/>
