<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- #282 오동통덩덩 — a white Dungi with HUGE rabbit ears, 몽이주름, a fresh pastel LUX-logo outfit, flashy accessories, holding a VOX handbag -->
<defs>
<clipPath id="cc"><circle cx="128" cy="128" r="124"/></clipPath>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#e8b923"/><stop offset="1" stop-color="#a87a12"/></linearGradient>
<pattern id="lux" width="40" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"><rect width="40" height="24" fill="#a7f3d0"/><text x="2" y="10" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="8.5" letter-spacing="1" fill="#0f766e">LUX</text><text x="22" y="22" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="8.5" letter-spacing="1" fill="#0f766e">LUX</text></pattern>
</defs>
<circle cx="128" cy="128" r="124" fill="#eafff6"/>
<g clip-path="url(#cc)">
<!-- LUX outfit -->
<path d="M30 262 C34 222 66 196 100 190 L156 190 C190 196 222 222 226 262 Z" fill="url(#lux)" stroke="#3a2a24" stroke-width="4"/>
<path d="M100 190 L128 214 L156 190" fill="#fff" stroke="#3a2a24" stroke-width="3" stroke-linejoin="round"/>
<path d="M118 206 l10 10 l10 -10" fill="none" stroke="#ff7ab6" stroke-width="5" stroke-linecap="round"/>
<!-- HUGE ears -->
<ellipse cx="88" cy="16" rx="24" ry="62" transform="rotate(-16 88 76)" fill="#fbfbfb" stroke="#3a2a24" stroke-width="4"/><ellipse cx="168" cy="16" rx="24" ry="62" transform="rotate(16 168 76)" fill="#fbfbfb" stroke="#3a2a24" stroke-width="4"/>
<ellipse cx="88" cy="22" rx="12" ry="48" transform="rotate(-16 88 76)" fill="#ffb8cf"/><ellipse cx="168" cy="22" rx="12" ry="48" transform="rotate(16 168 76)" fill="#ffb8cf"/>
<!-- head -->
<ellipse cx="128" cy="122" rx="64" ry="58" fill="#fbfbfb" stroke="#3a2a24" stroke-width="4"/>
<!-- jewelled hair clips -->
<g transform="translate(100 76) rotate(-20)"><rect x="-14" y="-4" width="28" height="8" rx="4" fill="url(#gold)" stroke="#a87a12" stroke-width="1.5"/><circle cx="-6" cy="0" r="2.4" fill="#ff4f8b"/><circle cx="2" cy="0" r="2.4" fill="#7ad7ff"/><circle cx="10" cy="0" r="2.4" fill="#ff4f8b"/></g>
<!-- face -->
<ellipse cx="92" cy="138" rx="13" ry="8" fill="#ff8fb5" opacity=".5"/><ellipse cx="164" cy="138" rx="13" ry="8" fill="#ff8fb5" opacity=".5"/>
<ellipse cx="104" cy="116" rx="12" ry="13" fill="#fff" stroke="#1a1a22" stroke-width="2"/><ellipse cx="104" cy="117" rx="8" ry="9" fill="#2a3a8a"/><circle cx="107" cy="113" r="3" fill="#fff"/>
<ellipse cx="152" cy="116" rx="12" ry="13" fill="#fff" stroke="#1a1a22" stroke-width="2"/><ellipse cx="152" cy="117" rx="8" ry="9" fill="#2a3a8a"/><circle cx="155" cy="113" r="3" fill="#fff"/>
<path d="M93 108 l-7 -6 M98 104 l-3 -8 M163 108 l7 -6 M158 104 l3 -8" stroke="#1a1a22" stroke-width="2.8" stroke-linecap="round"/>
<path d="M124 134 h8 l-4 5 Z" fill="#ff8fa8" stroke="#3a2a24" stroke-width="1.2"/>
<path d="M116 147 Q128 157 140 147" fill="#ff5c8a" stroke="#4a1a1a" stroke-width="3" stroke-linecap="round"/>
<path d="M108 139 Q100 151 108 163 M148 139 Q156 151 148 163" fill="none" stroke="#3a2a24" stroke-width="3.5" stroke-linecap="round"/>
<!-- big star earrings -->
<path d="M70 146 v8 M186 146 v8" stroke="url(#gold)" stroke-width="2.5"/>
<path d="M70 154 l3 7 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 Z" fill="url(#gold)" stroke="#a87a12" stroke-width="1.2"/>
<path d="M186 154 l3 7 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 Z" fill="url(#gold)" stroke="#a87a12" stroke-width="1.2"/>
<!-- chunky chain + bracelet -->
<path d="M98 192 Q128 226 158 192" fill="none" stroke="url(#gold)" stroke-width="5" stroke-dasharray="6 3"/>
<!-- the VOX handbag -->
<path d="M44 210 C44 190 74 190 74 210" fill="none" stroke="#3a2a24" stroke-width="5"/>
<rect x="34" y="208" width="50" height="38" rx="8" fill="#ff7ab6" stroke="#3a2a24" stroke-width="3"/>
<path d="M34 220 h50" stroke="#fff" stroke-width="2"/>
<text x="59" y="238" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="13" letter-spacing="1" fill="#fff">VOX</text>
<circle cx="74" cy="202" r="9" fill="#fbfbfb" stroke="#3a2a24" stroke-width="3"/>
<path d="M66 196 a9 9 0 0 1 16 0" fill="none" stroke="url(#gold)" stroke-width="3"/>
</g>
</svg>
