<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="gl" cx="40%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff" stop-opacity=".75"/><stop offset="50%" stop-color="#ffd0e0" stop-opacity=".45"/><stop offset="100%" stop-color="#ff9ec0" stop-opacity=".6"/></radialGradient>
    <radialGradient id="co" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#fff6b0"/><stop offset="60%" stop-color="#ffcc33"/><stop offset="100%" stop-color="#c88a00"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff6c0" stop-opacity=".8"/><stop offset="100%" stop-color="#fff6c0" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5a3a2a" stop-opacity=".3"/><stop offset="100%" stop-color="#5a3a2a" stop-opacity="0"/></radialGradient>
    <clipPath id="body"><ellipse cx="256" cy="282" rx="196" ry="170"/></clipPath>
    <g id="c"><circle r="22" fill="url(#co)" stroke="#a87000" stroke-width="4"/><text y="8" font-size="22" font-weight="900" text-anchor="middle" fill="#a87000" font-family="Arial Black,Arial">G</text></g>
  </defs>
  <circle cx="256" cy="270" r="250" fill="url(#aura)"/>
  <ellipse cx="256" cy="486" rx="170" ry="14" fill="url(#sh)"/>
  <!-- halo -->
  <ellipse cx="256" cy="44" rx="74" ry="16" fill="none" stroke="#ffe066" stroke-width="10"><animate attributeName="stroke-opacity" values="1;.5;1" dur="2s" repeatCount="indefinite"/></ellipse>
  <!-- tail -->
  <path d="M446 300 C490 290 494 246 466 244 C442 242 446 274 470 270" fill="none" stroke="#ff9ec0" stroke-width="12" stroke-linecap="round"/>
  <!-- legs -->
  <g fill="#ffc0d4" fill-opacity=".8" stroke="#d07090" stroke-width="5">
    <rect x="140" y="400" width="56" height="70" rx="24"/><rect x="316" y="400" width="56" height="70" rx="24"/>
  </g>
  <!-- ears -->
  <path d="M130 160 L104 60 L210 112 Z" fill="#ffc0d4" fill-opacity=".85" stroke="#d07090" stroke-width="6" stroke-linejoin="round"/>
  <path d="M382 160 L408 60 L302 112 Z" fill="#ffc0d4" fill-opacity=".85" stroke="#d07090" stroke-width="6" stroke-linejoin="round"/>
  <!-- coins inside the see-through body -->
  <g clip-path="url(#body)">
    <rect x="40" y="110" width="440" height="360" fill="#ffe0ea" opacity=".35"/>
    <g>
      <use href="#c" x="130" y="420"/><use href="#c" x="176" y="428"/><use href="#c" x="222" y="424"/><use href="#c" x="268" y="430"/><use href="#c" x="314" y="424"/><use href="#c" x="360" y="420"/><use href="#c" x="400" y="410"/>
      <use href="#c" x="110" y="390"/><use href="#c" x="154" y="392"/><use href="#c" x="200" y="388"/><use href="#c" x="246" y="394"/><use href="#c" x="292" y="390"/><use href="#c" x="338" y="394"/><use href="#c" x="384" y="384"/>
      <use href="#c" x="120" y="320"/><use href="#c" x="166" y="324"/><use href="#c" x="212" y="320"/><use href="#c" x="258" y="326"/><use href="#c" x="304" y="320"/><use href="#c" x="350" y="324"/><use href="#c" x="396" y="316"/><use href="#c" x="100" y="286"/><use href="#c" x="146" y="288"/><use href="#c" x="410" y="282"/><use href="#c" x="92" y="250"/><use href="#c" x="420" y="246"/><use href="#c" x="140" y="356"/><use href="#c" x="186" y="360"/><use href="#c" x="232" y="356"/><use href="#c" x="326" y="358"/><use href="#c" x="370" y="350"/>
      
    </g>
  </g>
  <!-- glass body -->
  <ellipse cx="256" cy="282" rx="196" ry="170" fill="url(#gl)" stroke="#d07090" stroke-width="6"/>
  <!-- coin slot -->
  <rect x="216" y="114" width="80" height="14" rx="7" fill="#8a3a5a"/>
  <!-- strained face: about to burst -->
  <path d="M168 214 L208 232 L168 248" fill="none" stroke="#3a1a24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M344 214 L304 232 L344 248" fill="none" stroke="#3a1a24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="256" cy="292" rx="66" ry="48" fill="#ff9ab8" fill-opacity=".9" stroke="#d07090" stroke-width="5"/>
  <ellipse cx="232" cy="292" rx="11" ry="17" fill="#a84a68"/><ellipse cx="280" cy="292" rx="11" ry="17" fill="#a84a68"/>
  <path d="M222 352 q11 -12 22 0 t22 0 t22 0" fill="none" stroke="#3a1a24" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="150" cy="282" rx="22" ry="12" fill="#ff6a8a" opacity=".55"/><ellipse cx="362" cy="282" rx="22" ry="12" fill="#ff6a8a" opacity=".55"/>
  <path d="M410 170 c10 16 10 30 0 34 c-10 -4 -10 -18 0 -34z" fill="#7ad0ff" stroke="#3a8ac0" stroke-width="3"><animate attributeName="opacity" values="1;.3;1" dur=".8s" repeatCount="indefinite"/></path>
  <path d="M100 196 c8 13 8 24 0 28 c-8 -4 -8 -15 0 -28z" fill="#7ad0ff" stroke="#3a8ac0" stroke-width="3"/>
  <!-- cracks -->
  <path d="M250 128 L262 160 L246 182 L266 206" fill="none" stroke="#7a2a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M430 300 L404 312 L414 334 L388 348" fill="none" stroke="#7a2a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 300 L108 316 L96 338 L122 354" fill="none" stroke="#7a2a4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- shine -->
  <ellipse cx="170" cy="170" rx="56" ry="20" fill="#fff" opacity=".6" transform="rotate(-24 170 170)"/>
  <path d="M120 230 C110 280 120 320 140 350" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".55"/>
  <!-- sparkles -->
  <g fill="#fff6a0">
    <path d="M60 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"><animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M450 150 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M430 400 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin=".5s" repeatCount="indefinite"/></path>
    <path d="M70 380 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"><animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></path>
  </g>
</svg>
