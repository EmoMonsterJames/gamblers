    <linearGradient id="es" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a5a"/><stop offset="1" stop-color="#1a1024"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="58" rx="20" ry="3.5" fill="#000" opacity=".25"/>
  <!-- top shell -->
  <path d="M8 30 C10 12 54 12 56 30 C48 24 16 24 8 30 Z" fill="url(#es)" stroke="#0e0618" stroke-width="2" stroke-linejoin="round"/>
  <path d="M20 26 L22 17 M32 24 L32 14 M44 26 L42 17" stroke="#6a5a7a" stroke-width="1.5" stroke-linecap="round"/>
