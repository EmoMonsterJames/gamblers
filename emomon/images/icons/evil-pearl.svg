  <!-- pearl -->
  <circle cx="32" cy="37" r="11" fill="url(#ep)" stroke="#1a0630" stroke-width="2"/>
  <circle cx="28" cy="33" r="3" fill="#fff" opacity=".8"/>
  <path d="M27 40 L30 41.5 L27 43 Z M37 40 L34 41.5 L37 43 Z" fill="#c8ff3a"/>
