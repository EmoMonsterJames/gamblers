    <rect x="300" y="200" width="70" height="120" rx="20" fill="#9aa3b2" stroke="#4a5262" stroke-width="4"/>
    <path d="M316 320 L326 360 L338 320 M344 320 L354 352 L364 320" fill="#ffb02a" stroke="#ff7a2a" stroke-width="3"/>
    <!-- legs floating -->
    <path d="M220 360 C210 400 200 420 186 440 M290 360 C300 400 318 418 336 430" fill="none" stroke="url(#suit)" stroke-width="36" stroke-linecap="round"/>
    <path d="M220 360 C210 400 200 420 186 440 M290 360 C300 400 318 418 336 430" fill="none" stroke="#7a8496" stroke-width="3"/>
    <ellipse cx="180" cy="448" rx="30" ry="18" fill="#4a5262"/><ellipse cx="344" cy="436" rx="30" ry="18" fill="#4a5262"/>
    <!-- body suit -->
    <rect x="170" y="230" width="170" height="150" rx="50" fill="url(#suit)" stroke="#7a8496" stroke-width="5"/>
    <rect x="216" y="262" width="78" height="50" rx="10" fill="#2a3448" stroke="#7a8496" stroke-width="3"/>
    <circle cx="236" cy="287" r="7" fill="#ff5a5a"/><circle cx="256" cy="287" r="7" fill="#ffd23a"/><circle cx="276" cy="287" r="7" fill="#3ae07a"/>
    <!-- arms waving -->
    <path d="M176 270 C130 250 110 200 120 160" fill="none" stroke="url(#suit)" stroke-width="32" stroke-linecap="round"/>
    <path d="M334 280 C370 300 396 300 420 284" fill="none" stroke="url(#suit)" stroke-width="32" stroke-linecap="round"/>
    <circle cx="120" cy="150" r="22" fill="#ff7a2a" stroke="#a3501a" stroke-width="4"/><circle cx="426" cy="280" r="22" fill="#ff7a2a" stroke="#a3501a" stroke-width="4"/>
    <!-- robot head inside helmet -->
    <rect x="186" y="96" width="140" height="110" rx="44" fill="#ffffff" stroke="#4a5262" stroke-width="5"/>
    <rect x="204" y="118" width="104" height="62" rx="26" fill="#0e1424" stroke="#20283a" stroke-width="3"/>
    <circle cx="234" cy="150" r="15" fill="#ffb02a"/><circle cx="278" cy="150" r="15" fill="#ffb02a"/>
    <circle cx="238" cy="145" r="5" fill="#fff"/><circle cx="282" cy="145" r="5" fill="#fff"/>
    <circle cx="256" cy="150" r="104" fill="url(#helmet)" stroke="#dfe8f5" stroke-width="7"/>
    <path d="M190 90 C210 66 240 56 270 58" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".8"/>
