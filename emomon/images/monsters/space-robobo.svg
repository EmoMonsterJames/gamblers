<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cdd3de"/></linearGradient>
    <radialGradient id="helmet" cx="38%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/><stop offset="60%" stop-color="#9ad8ff" stop-opacity=".25"/><stop offset="100%" stop-color="#4a8ad0" stop-opacity=".45"/></radialGradient>
    <radialGradient id="space" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#2a2a6e" stop-opacity=".55"/><stop offset="100%" stop-color="#0a0a2a" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#space)"/>
  <g fill="#ffd27a"><circle cx="60" cy="80" r="4"/><circle cx="440" cy="60" r="5"/><circle cx="470" cy="300" r="3"/><circle cx="40" cy="360" r="4"/><circle cx="380" cy="460" r="4"/><circle cx="120" cy="470" r="3"/></g>
  <!-- tether -->
  <path d="M70 470 C120 420 110 380 170 360" fill="none" stroke="#9aa3b2" stroke-width="6" stroke-dasharray="10 6"/>
