<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="body" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#d9f3ff"/>
      <stop offset="35%" stop-color="#7fc8ff"/>
      <stop offset="70%" stop-color="#8a6cff"/>
      <stop offset="100%" stop-color="#5a2fc0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b1a5a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#2b1a5a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="128" cy="222" rx="86" ry="14" fill="url(#shadow)"/>
  <!-- gooey body with drips -->
  <path d="M40 200 C 30 150, 50 70, 128 58 C 206 70, 226 150, 216 200
           C 214 214, 200 216, 192 206 C 186 222, 168 226, 160 210
           C 150 228, 126 230, 118 210 C 108 226, 88 224, 84 206
           C 72 218, 52 216, 50 202 C 46 206, 40 206, 40 200 Z"
        fill="url(#body)" stroke="#4a24a8" stroke-width="4" stroke-linejoin="round"/>
  <!-- top swirl (magic) -->
  <path d="M128 58 C 120 40, 138 26, 150 34 C 160 42, 150 56, 140 50" fill="none" stroke="#b98cff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="141" cy="49" r="5" fill="#ffe14d"/>
  <!-- shine -->
  <ellipse cx="96" cy="96" rx="34" ry="20" fill="url(#shine)" transform="rotate(-25 96 96)"/>
  <circle cx="70" cy="128" r="6" fill="#ffffff" opacity=".7"/>
  <!-- eyes: one round, one spiral (abnormal) -->
  <ellipse cx="102" cy="138" rx="15" ry="19" fill="#1b1040"/>
  <circle cx="107" cy="131" r="6" fill="#ffffff"/>
  <circle cx="98" cy="145" r="3" fill="#ffffff" opacity=".8"/>
  <circle cx="156" cy="138" r="18" fill="#ffffff" stroke="#1b1040" stroke-width="3"/>
  <path d="M156 138 m-3 0 a3 3 0 1 1 6 0 a6 6 0 1 1 -12 0 a9 9 0 1 1 18 0 a12 12 0 1 1 -24 0" fill="none" stroke="#6a3cff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M112 172 Q 130 188, 148 172" fill="none" stroke="#1b1040" stroke-width="5" stroke-linecap="round"/>
  <path d="M124 178 Q 130 190, 136 178" fill="#ff7aa8"/>
  <!-- cheeks -->
  <ellipse cx="84" cy="166" rx="10" ry="6" fill="#ff9ad5" opacity=".6"/>
  <ellipse cx="176" cy="166" rx="10" ry="6" fill="#ff9ad5" opacity=".6"/>
  <!-- floating droplets (water) -->
  <path d="M30 120 C 24 130, 26 140, 34 140 C 42 140, 42 130, 30 120 Z" fill="#7fc8ff" stroke="#4a24a8" stroke-width="2"/>
  <path d="M226 100 C 220 110, 222 120, 230 120 C 238 120, 238 110, 226 100 Z" fill="#b98cff" stroke="#4a24a8" stroke-width="2"/>
  <!-- sparkle -->
  <path d="M206 54 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#ffe14d"/>
</svg>
