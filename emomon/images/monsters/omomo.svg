  <circle cx="256" cy="250" r="168" fill="none" stroke="#2a1a4a" stroke-width="8"/>
  <!-- sad side -->
  <path d="M148 192 L196 206" stroke="#1c2a5a" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="176" cy="238" rx="18" ry="24" fill="#1c2a5a"/>
  <circle cx="182" cy="230" r="6" fill="#fff"/>
  <path d="M168 262 C162 284 160 296 168 304 C176 296 174 284 168 262 Z" fill="#bfe6ff" stroke="#4a8ad8" stroke-width="3"/>
  <path d="M150 340 C170 318 210 318 226 336" fill="none" stroke="#1c2a5a" stroke-width="8" stroke-linecap="round"/>
  <!-- happy side -->
  <path d="M310 216 C322 196 348 196 360 216" fill="none" stroke="#5a2a08" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="364" cy="282" rx="22" ry="14" fill="#ff8a8a" opacity=".7"/>
  <path d="M282 312 C300 362 352 362 372 312 Z" fill="#7a1a2a" stroke="#5a2a08" stroke-width="7" stroke-linejoin="round"/>
  <path d="M300 340 C316 352 340 352 354 340 C344 332 312 332 300 340 Z" fill="#ff7a8a"/>
  <!-- tiny sparkle -->
  <path d="M410 120 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z" fill="#fff" opacity=".9"/>
</svg>
