<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Bananazi: a banana dressed as a cartoon villain officer: black uniform and peaked cap, cracking a whip.
       The cap badge and armband use a made-up banana-peel skull emblem (no real-world symbols). -->
  <defs>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f9a825"/><stop offset=".5" stop-color="#ffee58"/><stop offset="1" stop-color="#f9a825"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#111"/><stop offset=".5" stop-color="#3a3a3a"/><stop offset="1" stop-color="#111"/></linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9575cd" stop-opacity=".5"/><stop offset="1" stop-color="#9575cd" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="236" fill="url(#aura)"/>
  <ellipse cx="256" cy="470" rx="120" ry="12" fill="url(#sh)"/>
  <!-- boots -->
  <path d="M196 410 L196 460 L160 460 Q150 448 170 440 L176 410 Z M316 410 L316 460 L352 460 Q362 448 342 440 L336 410 Z" fill="#111" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <!-- banana body (curved) -->
  <path d="M236 60 C200 120 186 220 196 320 C204 400 236 430 272 420 C296 412 320 380 322 310 C326 220 300 130 262 70 Z" fill="url(#peel)" stroke="#5d4000" stroke-width="7"/>
  <path d="M236 60 L246 30 L262 34 L262 70" fill="#6d4c41" stroke="#3e2723" stroke-width="5" stroke-linejoin="round"/>
  <!-- officer coat -->
  <path d="M190 236 C190 220 330 220 328 236 L334 420 L184 420 Z" fill="url(#coat)" stroke="#000" stroke-width="6"/>
  <path d="M258 230 L258 420" stroke="#555" stroke-width="3"/>
  <circle cx="258" cy="270" r="5" fill="#bdbdbd"/><circle cx="258" cy="310" r="5" fill="#bdbdbd"/><circle cx="258" cy="350" r="5" fill="#bdbdbd"/>
  <rect x="184" y="370" width="150" height="16" fill="#3e2723" stroke="#000" stroke-width="3"/><rect x="248" y="368" width="20" height="20" fill="none" stroke="#bdbdbd" stroke-width="4"/>
  <path d="M190 236 L230 260 L258 236 L286 260 L328 236" fill="none" stroke="#757575" stroke-width="4"/>
  <!-- epaulettes -->
  <rect x="176" y="232" width="34" height="12" rx="4" fill="#bdbdbd" stroke="#000" stroke-width="3"/><rect x="310" y="232" width="34" height="12" rx="4" fill="#bdbdbd" stroke="#000" stroke-width="3"/>
  <!-- armband with the made-up emblem -->
  <rect x="160" y="280" width="34" height="30" fill="#7b1fa2" stroke="#000" stroke-width="3"/>
  <circle cx="177" cy="295" r="9" fill="#ffee58" stroke="#000" stroke-width="2"/><circle cx="174" cy="293" r="2" fill="#000"/><circle cx="180" cy="293" r="2" fill="#000"/>
  <!-- arms -->
  <path d="M186 250 C150 280 140 320 150 350" fill="none" stroke="#1a1a1a" stroke-width="26" stroke-linecap="round"/>
  <circle cx="150" cy="356" r="14" fill="#fff" stroke="#000" stroke-width="4"/>
  <path d="M330 250 C370 230 390 200 396 170" fill="none" stroke="#1a1a1a" stroke-width="26" stroke-linecap="round"/>
  <circle cx="396" cy="164" r="14" fill="#fff" stroke="#000" stroke-width="4"/>
  <!-- whip cracking -->
  <rect x="390" y="120" width="12" height="46" rx="4" fill="#5d4037" stroke="#000" stroke-width="3" transform="rotate(15 396 143)"/>
  <path d="M402 120 C430 70 480 70 470 120 C462 160 420 150 450 190" fill="none" stroke="#4e342e" stroke-width="5" stroke-linecap="round"/>
  <path d="M450 190 l14 -6 M450 190 l4 14 M450 190 l-12 4" stroke="#fff176" stroke-width="4" stroke-linecap="round"/>
  <!-- face with a sneer -->
  <path d="M220 172 L246 182 M296 172 L270 182" stroke="#3e2723" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="236" cy="194" rx="11" ry="9" fill="#fff" stroke="#3e2723" stroke-width="4"/><ellipse cx="280" cy="194" rx="11" ry="9" fill="#fff" stroke="#3e2723" stroke-width="4"/>
  <circle cx="238" cy="196" r="5" fill="#000"/><circle cx="278" cy="196" r="5" fill="#000"/>
  <path d="M240 216 Q258 208 278 220" fill="none" stroke="#3e2723" stroke-width="5" stroke-linecap="round"/>
  <!-- peaked officer cap with made-up banana-peel skull badge -->
  <path d="M196 140 C196 96 320 96 322 140 Z" fill="#1a1a1a" stroke="#000" stroke-width="6"/>
  <path d="M190 140 L330 140 L340 152 L180 152 Z" fill="#212121" stroke="#000" stroke-width="5"/>
  <path d="M200 152 C230 170 290 170 318 152" fill="#000" stroke="#000" stroke-width="4"/>
  <rect x="196" y="132" width="126" height="8" fill="#7b1fa2"/>
  <g transform="translate(258 112)">
    <path d="M-22 -4 C-26 -16 -14 -18 -10 -10 M22 -4 C26 -16 14 -18 10 -10 M0 -12 C-2 -26 4 -26 2 -12" fill="#ffee58" stroke="#5d4000" stroke-width="3"/>
    <circle cx="0" cy="2" r="14" fill="#e0e0e0" stroke="#000" stroke-width="3"/>
    <circle cx="-5" cy="0" r="4" fill="#000"/><circle cx="5" cy="0" r="4" fill="#000"/><path d="M-4 9 h8" stroke="#000" stroke-width="2"/>
  </g>
</svg>
