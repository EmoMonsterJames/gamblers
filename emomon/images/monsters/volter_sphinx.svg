<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Volter-Sphinx: a lean obsidian feline sphinx with wings of static energy, neon-green veins and crackling voltage gauntlets -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a48"/><stop offset="1" stop-color="#121218"/></linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9ff5a" stop-opacity=".9"/><stop offset="1" stop-color="#39ff9c" stop-opacity=".25"/></linearGradient>
    <radialGradient id="glove" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#fff9b0"/><stop offset=".5" stop-color="#ffe14d"/><stop offset="1" stop-color="#b88a00"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b8ff6a" stop-opacity=".45"/><stop offset="1" stop-color="#b8ff6a" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="236" fill="url(#aura)"/>
  <ellipse cx="256" cy="468" rx="170" ry="14" fill="#0a0a10" opacity=".3"/>
  <!-- furled static wings -->
  <path d="M220 230 C150 140 70 120 30 150 C70 170 90 200 92 230 C60 240 50 270 60 290 C120 270 170 270 220 280 Z" fill="url(#wing)" stroke="#9cff3a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M292 230 C362 140 442 120 482 150 C442 170 422 200 420 230 C452 240 462 270 452 290 C392 270 342 270 292 280 Z" fill="url(#wing)" stroke="#9cff3a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M90 170 l30 30 l-20 6 l34 36 M422 170 l-30 30 l20 6 l-34 36" fill="none" stroke="#f4ff9a" stroke-width="5" stroke-linejoin="round"/>
  <!-- lean crouching body -->
  <path d="M150 420 C140 340 180 280 256 276 C332 280 372 340 362 420 Z" fill="url(#fur)" stroke="#05050a" stroke-width="8"/>
  <path d="M190 330 q20 20 0 50 M322 330 q-20 20 0 50 M256 300 v70" fill="none" stroke="#39ff9c" stroke-width="5" stroke-linecap="round" opacity=".95"/>
  <!-- tail with spark tip -->
  <path d="M352 400 C420 410 450 370 440 330" fill="none" stroke="#05050a" stroke-width="22" stroke-linecap="round"/>
  <path d="M352 400 C420 410 450 370 440 330" fill="none" stroke="#2a2a36" stroke-width="12" stroke-linecap="round"/>
  <path d="M440 330 l10 -24 l-20 10 l14 -30" fill="none" stroke="#ffe14d" stroke-width="6" stroke-linejoin="round"/>
  <!-- front paws in voltage gauntlets -->
  <ellipse cx="196" cy="440" rx="44" ry="26" fill="url(#glove)" stroke="#6a4a00" stroke-width="6"/>
  <ellipse cx="316" cy="440" rx="44" ry="26" fill="url(#glove)" stroke="#6a4a00" stroke-width="6"/>
  <path d="M164 426 l12 -18 l6 14 l12 -20 M284 426 l12 -18 l6 14 l12 -20" fill="none" stroke="#fffde0" stroke-width="4"/>
  <!-- sphinx head with headdress -->
  <path d="M176 120 L200 60 L226 116 Z M336 120 L312 60 L286 116 Z" fill="url(#fur)" stroke="#05050a" stroke-width="7" stroke-linejoin="round"/>
  <path d="M170 130 C170 230 200 270 256 270 C312 270 342 230 342 130 C320 104 290 96 256 96 C222 96 192 104 170 130 Z" fill="url(#fur)" stroke="#05050a" stroke-width="8"/>
  <path d="M176 140 C150 190 150 250 176 290 L196 280 C184 240 186 190 200 150 Z M336 140 C362 190 362 250 336 290 L316 280 C328 240 326 190 312 150 Z" fill="#39ff9c" opacity=".55" stroke="#05050a" stroke-width="5"/>
  <!-- glowing eyes, slit pupils -->
  <path d="M196 180 Q216 164 238 184 Q216 198 196 180 Z M274 184 Q296 164 316 180 Q296 198 274 184 Z" fill="#d9ff5a" stroke="#05050a" stroke-width="4"/>
  <ellipse cx="217" cy="182" rx="4" ry="11" fill="#05050a"/><ellipse cx="295" cy="182" rx="4" ry="11" fill="#05050a"/>
  <path d="M246 214 h20 l-10 12 Z" fill="#9cff3a"/>
  <path d="M236 240 Q256 254 276 240" fill="none" stroke="#9cff3a" stroke-width="4" stroke-linecap="round"/>
  <!-- sparks -->
  <path d="M96 340 l18 -10 l-6 16 l18 -8 M418 330 l-18 -10 l6 16 l-18 -8 M250 40 l8 22 l-14 -4 l10 24" fill="none" stroke="#ffe14d" stroke-width="5" stroke-linejoin="round"/>
</svg>
