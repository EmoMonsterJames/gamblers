<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Synaps: a translucent amber-quartz creature whose crystal body reveals a branching nervous system; yellow lightning arcs between its nodes -->
  <defs>
    <radialGradient id="quartz" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#fff8e1" stop-opacity=".95"/><stop offset=".5" stop-color="#ffca28" stop-opacity=".75"/><stop offset="1" stop-color="#e65100" stop-opacity=".85"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff176" stop-opacity=".6"/><stop offset="1" stop-color="#fff176" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4e2600" stop-opacity=".35"/><stop offset="1" stop-color="#4e2600" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="236" fill="url(#aura)"/>
  <ellipse cx="256" cy="454" rx="130" ry="14" fill="url(#sh)"/>
  <!-- crystal legs -->
  <path d="M180 360 L160 440 L200 440 Z M332 360 L312 440 L352 440 Z" fill="url(#quartz)" stroke="#8d4a00" stroke-width="6" stroke-linejoin="round"/>
  <!-- faceted body -->
  <path d="M256 60 L360 130 L390 260 L330 380 L182 380 L122 260 L152 130 Z" fill="url(#quartz)" stroke="#8d4a00" stroke-width="8" stroke-linejoin="round"/>
  <path d="M256 60 L256 380 M152 130 L330 380 M360 130 L182 380 M122 260 L390 260" stroke="#fff8e1" stroke-width="2" opacity=".5"/>
  <!-- nervous system inside -->
  <g fill="none" stroke="#ff6f00" stroke-width="5" stroke-linecap="round">
    <path d="M256 120 L256 340"/>
    <path d="M256 170 C220 170 200 150 180 140 M256 170 C292 170 312 150 332 140"/>
    <path d="M256 240 C210 250 170 250 150 270 M256 240 C302 250 342 250 362 270"/>
    <path d="M256 300 C230 320 210 340 196 360 M256 300 C282 320 302 340 316 360"/>
  </g>
  <g fill="#fff59d" stroke="#ff6f00" stroke-width="3"><circle cx="256" cy="120" r="10"/><circle cx="180" cy="140" r="8"/><circle cx="332" cy="140" r="8"/><circle cx="150" cy="270" r="8"/><circle cx="362" cy="270" r="8"/><circle cx="196" cy="360" r="7"/><circle cx="316" cy="360" r="7"/></g>
  <!-- face -->
  <ellipse cx="220" cy="206" rx="18" ry="20" fill="#fff" stroke="#8d4a00" stroke-width="5"/>
  <ellipse cx="292" cy="206" rx="18" ry="20" fill="#fff" stroke="#8d4a00" stroke-width="5"/>
  <circle cx="222" cy="208" r="9" fill="#3e2000"/><circle cx="294" cy="208" r="9" fill="#3e2000"/>
  <circle cx="225" cy="204" r="3" fill="#fff"/><circle cx="297" cy="204" r="3" fill="#fff"/>
  <path d="M236 270 Q256 282 276 270" fill="none" stroke="#8d4a00" stroke-width="5" stroke-linecap="round"/>
  <!-- yellow lightning arcs -->
  <path d="M180 140 L120 110 L136 96 L76 70" fill="none" stroke="#ffeb3b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M332 140 L392 110 L376 96 L436 70" fill="none" stroke="#ffeb3b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M362 270 L420 296 L404 310 L466 334" fill="none" stroke="#ffeb3b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M150 270 L92 296 L108 310 L46 334" fill="none" stroke="#ffeb3b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
