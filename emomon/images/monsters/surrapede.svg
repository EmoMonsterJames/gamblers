<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="ragged" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <radialGradient id="body" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#a8e05a"/>
      <stop offset="55%" stop-color="#4f9a2c"/>
      <stop offset="100%" stop-color="#1f4a1a"/>
    </radialGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5a2a6e"/>
      <stop offset="60%" stop-color="#1a0b22"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3c7f22"/>
      <stop offset="100%" stop-color="#b8ef5e"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a4a52"/>
      <stop offset="100%" stop-color="#4a1c24"/>
    </linearGradient>
    <!-- spike pointing up from 0,0 -->
    <path id="sp" d="M-13 0 C-9 -22 -4 -42 3 -62 C7 -40 11 -20 15 0 Z" fill="url(#blade)"/>
    <path id="spd" d="M-9 0 C-6 -14 -2 -28 3 -40 C6 -26 8 -14 10 0 Z" fill="#2f6a1e"/>
    <!-- leg pointing down from the hip at 0,0 -->
    <g id="leg">
      <path d="M0 0 C-25 20 -40 50 -40 80 L-44 120" fill="none" stroke="#3a7a22" stroke-width="13" stroke-linecap="round"/>
      <path d="M-22 18 l-14 -8 M-38 52 l-14 -2 M-40 88 l-13 2" stroke="#8fd44a" stroke-width="5" stroke-linecap="round"/>
      <path d="M-50 112 L-44 150 L-36 114 Z" fill="url(#claw)" stroke="#2a0e14" stroke-width="2"/>
    </g>
  </defs>

  <g transform="translate(-8 36) scale(0.86)">
  <!-- evil aura -->
  <ellipse cx="290" cy="300" rx="210" ry="150" fill="#7a3fb8" opacity=".35" filter="url(#blur)"/>

  <!-- back legs under the tail segments -->
  <use xlink:href="#leg" transform="translate(470 250) scale(-.7 .9)"/>
  <use xlink:href="#leg" transform="translate(430 270) scale(-.8 .95)"/>
  <use xlink:href="#leg" transform="translate(390 290) scale(-.85 1)"/>
  <use xlink:href="#leg" transform="translate(330 315)"/>
  <use xlink:href="#leg" transform="translate(300 320) scale(.9)"/>

  <!-- tail segments with spikes -->
  <g>
    <use xlink:href="#sp" transform="translate(455 205) rotate(-40) translate(0 -42)"/>
    <use xlink:href="#sp" transform="translate(455 205) rotate(5) translate(0 -42)"/>
    <use xlink:href="#sp" transform="translate(455 205) rotate(55) translate(0 -42)"/>
    <use xlink:href="#sp" transform="translate(455 205) rotate(100) translate(0 -42)"/>
    <use xlink:href="#sp" transform="translate(400 235) rotate(-55) translate(0 -55)"/>
    <use xlink:href="#sp" transform="translate(400 235) rotate(-15) translate(0 -55)"/>
    <use xlink:href="#sp" transform="translate(400 235) rotate(25) translate(0 -55)"/>
    <use xlink:href="#sp" transform="translate(400 235) rotate(70) translate(0 -55)"/>
    <use xlink:href="#sp" transform="translate(335 265) rotate(-60) translate(0 -68)"/>
    <use xlink:href="#sp" transform="translate(335 265) rotate(-25) translate(0 -68)"/>
    <use xlink:href="#sp" transform="translate(335 265) rotate(10) translate(0 -68)"/>
    <use xlink:href="#sp" transform="translate(335 265) rotate(45) translate(0 -68)"/>
    <use xlink:href="#sp" transform="translate(335 265) rotate(85) translate(0 -68)"/>
  </g>
  <g filter="url(#ragged)" fill="url(#body)">
    <circle cx="455" cy="210" r="46"/>
    <circle cx="400" cy="238" r="60"/>
    <circle cx="335" cy="268" r="76"/>
  </g>
  <g fill="#1f4a1a" opacity=".55">
    <ellipse cx="350" cy="295" rx="12" ry="7"/><ellipse cx="410" cy="262" rx="9" ry="6"/><ellipse cx="318" cy="240" rx="7" ry="5"/>
  </g>
  <g fill="#7a3fb8" opacity=".45">
    <circle cx="372" cy="250" r="5"/><circle cx="430" cy="225" r="4"/><circle cx="300" cy="300" r="5"/>
  </g>

  <!-- antennae -->
  <path d="M175 150 C150 90 105 70 70 90 C60 96 58 108 66 112" fill="none" stroke="#6b4a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M225 140 C215 75 180 40 140 45 C128 47 124 58 132 62" fill="none" stroke="#6b4a3a" stroke-width="6" stroke-linecap="round"/>

  <!-- head spikes -->
  <g>
    <use xlink:href="#sp" transform="translate(210 255) rotate(-120) translate(0 -105)"/>
    <use xlink:href="#sp" transform="translate(210 255) rotate(-95) translate(0 -105)"/>
    <use xlink:href="#sp" transform="translate(210 255) rotate(-70) translate(0 -105)"/>
    <use xlink:href="#sp" transform="translate(210 255) rotate(-45) translate(0 -105)"/>
    <use xlink:href="#sp" transform="translate(210 255) rotate(-22) translate(0 -105)"/>
    <use xlink:href="#sp" transform="translate(210 255) rotate(0) translate(0 -105)"/>
    <use xlink:href="#sp" transform="translate(210 255) rotate(22) translate(0 -105)"/>
    <use xlink:href="#sp" transform="translate(210 255) rotate(45) translate(0 -105)"/>
    <use xlink:href="#spd" transform="translate(210 255) rotate(-82) translate(0 -100)"/>
    <use xlink:href="#spd" transform="translate(210 255) rotate(-33) translate(0 -100)"/>
    <use xlink:href="#spd" transform="translate(210 255) rotate(11) translate(0 -100)"/>
  </g>

  <!-- front arms (behind the head) -->
  <use xlink:href="#leg" transform="translate(140 300) scale(1.25 1.15)"/>
  <use xlink:href="#leg" transform="translate(270 320) scale(-1.1 1.05)"/>

  <!-- head -->
  <ellipse cx="210" cy="255" rx="112" ry="110" fill="url(#body)" filter="url(#ragged)"/>
  <g fill="none" stroke="#9ad94e" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M150 180 l-12 -12 M185 160 l-4 -18 M235 158 l6 -17 M275 178 l14 -10 M120 240 l-16 -4 M300 235 l16 -2"/>
  </g>

  <!-- eyes: two big dark ones and two small ones (evil) -->
  <circle cx="178" cy="178" r="18" fill="url(#eye)" stroke="#0d0510" stroke-width="2"/>
  <circle cx="242" cy="172" r="20" fill="url(#eye)" stroke="#0d0510" stroke-width="2"/>
  <circle cx="211" cy="160" r="7" fill="url(#eye)"/>
  <circle cx="272" cy="196" r="6" fill="url(#eye)"/>
  <circle cx="172" cy="172" r="4.5" fill="#fff"/><circle cx="236" cy="165" r="5" fill="#fff"/>
  <circle cx="184" cy="185" r="2.5" fill="#ff4d6d"/><circle cx="249" cy="180" r="2.5" fill="#ff4d6d"/>

  <!-- huge open mouth -->
  <path d="M135 215 Q210 196 292 214 Q288 320 214 352 Q142 322 135 215 Z" fill="#4a0f1e"/>
  <path d="M160 232 Q212 220 268 232 Q262 300 214 322 Q166 302 160 232 Z" fill="#220610"/>
  <path d="M180 300 Q214 278 248 300 Q236 322 214 328 Q192 322 180 300 Z" fill="#a8455a"/>
  <g fill="#fff4d6" stroke="#bfa47a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M140 218 L150 248 L158 214 Z M160 212 L170 246 L178 210 Z M181 208 L190 244 L199 207 Z M202 206 L211 242 L220 206 Z M223 207 L232 243 L241 208 Z M244 209 L253 244 L262 211 Z M265 212 L273 242 L281 214 Z M283 216 L288 236 L292 218 Z"/>
    <path d="M142 250 L160 262 L146 272 Z M148 290 L166 292 L156 306 Z M286 248 L268 262 L282 270 Z M280 288 L262 292 L272 306 Z"/>
    <path d="M168 318 L180 300 L186 328 Z M192 336 L200 314 L208 342 Z M220 342 L228 316 L236 338 Z M244 330 L250 308 L260 322 Z"/>
  </g>
  </g>
</svg>
