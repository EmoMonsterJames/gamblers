<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="frost" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="mist" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="body" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f2fbff"/>
      <stop offset="55%" stop-color="#b8e2f6"/>
      <stop offset="100%" stop-color="#6fa8d6"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5fa8e0" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#e8f8ff"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a5a8a" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#3a5a8a" stop-opacity="0"/>
    </radialGradient>
    <path id="shard" d="M-14 0 L0 -70 L14 0 Z"/>
  </defs>

  <ellipse cx="256" cy="482" rx="190" ry="18" fill="url(#shadow)"/>
  <ellipse cx="256" cy="300" rx="210" ry="170" fill="#bfe8ff" opacity=".35" filter="url(#mist)"/>

  <!-- ice shards on the back and shoulders -->
  <g fill="url(#ice)" stroke="#3a78b0" stroke-width="2.5" stroke-linejoin="round">
    <use href="#shard" transform="translate(140 200) rotate(-40) scale(1.2)"/>
    <use href="#shard" transform="translate(176 160) rotate(-20) scale(1.4)"/>
    <use href="#shard" transform="translate(220 140) rotate(-6) scale(1.1)"/>
    <use href="#shard" transform="translate(292 140) rotate(6) scale(1.1)"/>
    <use href="#shard" transform="translate(336 160) rotate(20) scale(1.4)"/>
    <use href="#shard" transform="translate(372 200) rotate(40) scale(1.2)"/>
  </g>

  <!-- stubby legs -->
  <g fill="url(#body)" filter="url(#frost)">
    <ellipse cx="190" cy="448" rx="54" ry="34"/>
    <ellipse cx="322" cy="448" rx="54" ry="34"/>
  </g>
  <g fill="#e8f8ff" stroke="#3a78b0" stroke-width="2">
    <path d="M150 470 l-6 14 l14 -6 Z M178 474 l0 14 l10 -10 Z M354 474 l0 14 l-10 -10 Z M362 470 l6 14 l-14 -6 Z"/>
  </g>

  <!-- big frosty body -->
  <path d="M120 300 C110 210 170 150 256 150 C342 150 402 210 392 300 C384 390 330 448 256 448 C182 448 128 390 120 300 Z"
        fill="url(#body)" filter="url(#frost)"/>
  <ellipse cx="256" cy="360" rx="96" ry="72" fill="#f4fcff" opacity=".7"/>

  <!-- huge icy arms -->
  <path d="M128 260 C80 280 60 340 70 400" fill="none" stroke="#a8d6f0" stroke-width="44" stroke-linecap="round" filter="url(#frost)"/>
  <path d="M384 260 C432 280 452 340 442 400" fill="none" stroke="#a8d6f0" stroke-width="44" stroke-linecap="round" filter="url(#frost)"/>
  <g fill="#e8f8ff" stroke="#3a78b0" stroke-width="2">
    <path d="M50 404 l-6 22 l16 -10 Z M70 412 l0 24 l12 -18 Z M90 406 l8 22 l2 -20 Z"/>
    <path d="M462 404 l6 22 l-16 -10 Z M442 412 l0 24 l-12 -18 Z M422 406 l-8 22 l-2 -20 Z"/>
  </g>

  <!-- face -->
  <path d="M176 230 C200 214 312 214 336 230 C340 280 312 310 256 312 C200 310 172 280 176 230 Z" fill="#e8f8ff" stroke="#8ec4e6" stroke-width="2"/>
  <circle cx="222" cy="252" r="16" fill="#4fe0ff" opacity=".7" filter="url(#glow)"/>
  <circle cx="290" cy="252" r="16" fill="#4fe0ff" opacity=".7" filter="url(#glow)"/>
  <ellipse cx="222" cy="252" rx="12" ry="13" fill="#0a2a4a"/>
  <ellipse cx="290" cy="252" rx="12" ry="13" fill="#0a2a4a"/>
  <circle cx="224" cy="254" r="6" fill="#5fe6ff"/><circle cx="292" cy="254" r="6" fill="#5fe6ff"/>
  <circle cx="220" cy="248" r="2.5" fill="#fff"/><circle cx="288" cy="248" r="2.5" fill="#fff"/>
  <path d="M202 232 L240 240 M310 232 L272 240" stroke="#3a78b0" stroke-width="5" stroke-linecap="round"/>
  <!-- grumpy fanged mouth with frosty breath -->
  <path d="M230 284 Q256 276 282 284 Q276 302 256 304 Q236 302 230 284 Z" fill="#1a3a5a"/>
  <path d="M236 284 l4 9 l4 -8 Z M268 284 l4 8 l4 -9 Z" fill="#fff"/>
  <g fill="#e8f8ff" opacity=".8">
    <circle cx="300" cy="300" r="8"/><circle cx="318" cy="308" r="6"/><circle cx="332" cy="300" r="4"/>
  </g>

  <!-- snowflakes -->
  <g stroke="#bfe8ff" stroke-width="3" stroke-linecap="round">
    <path d="M60 120 l0 24 M48 132 l24 0 M52 124 l16 16 M68 124 l-16 16"/>
    <path d="M450 110 l0 20 M440 120 l20 0 M443 113 l14 14 M457 113 l-14 14"/>
    <path d="M470 300 l0 14 M463 307 l14 0"/>
  </g>
</svg>
