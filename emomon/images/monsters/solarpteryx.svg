  <circle cx="290" cy="236" r="26" fill="#fffbe0" stroke="#7a2a0a" stroke-width="6"/>
  <circle cx="222" cy="236" r="11" fill="#ffffff"/><circle cx="290" cy="236" r="11" fill="#ffffff"/>
  <circle cx="222" cy="236" r="20" fill="none" stroke="#ffd84a" stroke-width="4"/><circle cx="290" cy="236" r="20" fill="none" stroke="#ffd84a" stroke-width="4"/>
