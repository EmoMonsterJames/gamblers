<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="body" cx="45%" cy="40%" r="65%"><stop offset="0%" stop-color="#fffbe8"/><stop offset="60%" stop-color="#ffd86a"/><stop offset="100%" stop-color="#f08a2a"/></radialGradient>
    <radialGradient id="flame" cx="50%" cy="80%" r="70%"><stop offset="0%" stop-color="#fff4a0"/><stop offset="50%" stop-color="#ff8a2a"/><stop offset="100%" stop-color="#d8202a"/></radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ffe46a"/></linearGradient>
    <radialGradient id="beam" cx="50%" cy="0%" r="100%"><stop offset="0%" stop-color="#fffbd0" stop-opacity=".75"/><stop offset="100%" stop-color="#fffbd0" stop-opacity="0"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffd84a" stop-opacity=".6"/><stop offset="70%" stop-color="#ff8a3a" stop-opacity=".2"/><stop offset="100%" stop-color="#ff8a3a" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3a1a0a" stop-opacity=".3"/><stop offset="100%" stop-color="#3a1a0a" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="246" r="250" fill="url(#aura)"/>
