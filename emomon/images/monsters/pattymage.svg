<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pattymage: a floating gourmet burger, top bun worn as a wizard hat, melted-cheese face, toothpick wand -->
  <defs>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8c873"/><stop offset="1" stop-color="#c47a26"/></linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#f9a825"/></linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe082" stop-opacity=".75"/><stop offset="1" stop-color="#ffe082" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3a2000" stop-opacity=".3"/><stop offset="1" stop-color="#3a2000" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="250" r="240" fill="url(#aura)"/>
  <ellipse cx="256" cy="470" rx="110" ry="12" fill="url(#sh)"/>
  <!-- floating layers -->
  <path d="M120 400 Q120 448 256 450 Q392 448 392 400 Z" fill="url(#bun)" stroke="#6b3d0c" stroke-width="7"/>
  <path d="M110 376 Q150 360 190 378 Q230 360 270 378 Q310 360 350 378 Q384 364 402 380 L396 392 L116 392 Z" fill="#7cb342" stroke="#2e5a10" stroke-width="6" stroke-linejoin="round"/>
  <rect x="140" y="346" width="232" height="24" rx="12" fill="#e53935" stroke="#7a0000" stroke-width="6"/>
  <path d="M112 300 Q112 270 256 268 Q400 270 400 300 L400 320 Q400 344 256 346 Q112 344 112 320 Z" fill="#6d3b1c" stroke="#3a1a06" stroke-width="7"/>
  <!-- melted cheese face -->
  <path d="M118 212 L394 212 L390 276 C380 280 372 300 362 278 C346 282 338 308 322 280 C300 284 290 312 272 282 C250 284 236 312 222 282 C200 284 188 304 176 280 C160 284 150 300 140 276 L122 276 Z" fill="url(#cheese)" stroke="#a06a00" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="210" cy="238" r="15" fill="#3a2000"/><circle cx="302" cy="238" r="15" fill="#3a2000"/>
  <circle cx="214" cy="233" r="5" fill="#fff"/><circle cx="306" cy="233" r="5" fill="#fff"/>
  <path d="M232 262 Q256 276 280 262" fill="none" stroke="#3a2000" stroke-width="6" stroke-linecap="round"/>
  <!-- top bun = wizard hat, tilted back -->
  <path d="M110 214 C120 150 180 120 236 116 L300 20 L318 116 C370 126 404 160 404 214 Z" fill="url(#bun)" stroke="#6b3d0c" stroke-width="8" stroke-linejoin="round"/>
  <path d="M116 200 Q256 176 398 200" fill="none" stroke="#7e57c2" stroke-width="12"/>
  <path d="M300 20 L306 70 L292 76 Z" fill="#7e57c2"/>
  <ellipse cx="180" cy="168" rx="8" ry="5" fill="#fff8e1"/><ellipse cx="230" cy="150" rx="8" ry="5" fill="#fff8e1"/><ellipse cx="340" cy="162" rx="8" ry="5" fill="#fff8e1"/>
  <path d="M262 160 l6 12 l12 2 l-9 8 l2 12 l-11 -6 l-11 6 l2 -12 l-9 -8 l12 -2 Z" fill="#ffd54f"/>
  <!-- toothpick wand -->
  <path d="M420 330 L470 170" stroke="#d7b98a" stroke-width="8" stroke-linecap="round"/>
  <path d="M470 170 l-14 -30 M470 170 l26 -22" stroke="#e53935" stroke-width="6" stroke-linecap="round"/>
  <circle cx="470" cy="160" r="14" fill="#fff59d" opacity=".9"/>
  <!-- scalding condiment drops + heat -->
  <path d="M60 120 Q70 140 60 150 Q50 140 60 120 Z" fill="#e53935"/><path d="M90 70 Q100 90 90 100 Q80 90 90 70 Z" fill="#fdd835"/>
  <path d="M40 260 Q56 244 40 228 M70 250 Q86 234 70 218" fill="none" stroke="#ff7043" stroke-width="5" stroke-linecap="round"/>
</svg>
