    <path d="M136 420 C120 340 150 250 200 200"/><path d="M220 140 C270 120 330 130 370 180"/><path d="M386 230 C396 270 392 310 380 350"/>
    <path d="M150 320 a16 16 0 1 1 16 16 M300 130 a14 14 0 1 1 -14 14 M390 300 a12 12 0 1 1 12 -12"/>
  </g>
