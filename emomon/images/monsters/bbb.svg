    <linearGradient id="wat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8f6ff" stop-opacity=".9"/><stop offset=".5" stop-color="#2a9cff"/><stop offset="1" stop-color="#0a3aa8"/></linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b8e8ff" stop-opacity=".55"/><stop offset="1" stop-color="#b8e8ff" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="236" fill="url(#aura)"/>
  <path d="M30 478 q40 -20 80 0 q40 20 80 0 q40 -20 80 0 q40 20 80 0 q40 -20 80 0" fill="none" stroke="#2a9cff" stroke-width="7" opacity=".6"/>
