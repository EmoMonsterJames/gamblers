  <path d="M330 446 C300 470 260 470 220 456 C250 480 300 488 340 466 Z" fill="#7ad8ff" stroke="#0a2a7a" stroke-width="4"/>
  <path d="M340 360 C340 330 356 316 372 312 C368 330 362 344 354 360 Z M400 362 C412 332 430 324 444 326 C436 346 424 358 410 366 Z" fill="#7ad8ff" stroke="#0a2a7a" stroke-width="4"/>
  <circle cx="352" cy="400" r="11" fill="#fff" stroke="#0a2a7a" stroke-width="4"/><circle cx="400" cy="400" r="11" fill="#fff" stroke="#0a2a7a" stroke-width="4"/>
  <circle cx="354" cy="402" r="5" fill="#0a1a4a"/><circle cx="398" cy="402" r="5" fill="#0a1a4a"/>
  <text x="62" y="90" font-family="Arial Black, sans-serif" font-size="46" font-weight="900" fill="#1a7aff" stroke="#0a2a7a" stroke-width="3">B</text>
</svg>
