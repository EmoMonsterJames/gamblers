<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Chinchin: a perfectly round lilac chinchilla, huge glowing pink eyes, fan ears, stardust trail -->
  <defs>
    <radialGradient id="fur" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f3e5f5"/><stop offset=".6" stop-color="#ce93d8"/><stop offset="1" stop-color="#9c64b8"/></radialGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="60%"><stop offset="0" stop-color="#ffd1e8"/><stop offset=".5" stop-color="#ff4fa0"/><stop offset="1" stop-color="#8a0050"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f8bbd0" stop-opacity=".7"/><stop offset="1" stop-color="#f8bbd0" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3a1050" stop-opacity=".35"/><stop offset="1" stop-color="#3a1050" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#aura)"/>
  <ellipse cx="256" cy="452" rx="130" ry="14" fill="url(#sh)"/>
  <!-- stardust trail -->
  <circle cx="60" cy="420" r="5" fill="#fff59d"/><circle cx="90" cy="400" r="7" fill="#fff"/><circle cx="40" cy="380" r="4" fill="#f8bbd0"/><circle cx="110" cy="430" r="4" fill="#fff59d"/>
  <!-- fan ears -->
  <ellipse cx="150" cy="120" rx="66" ry="80" fill="url(#fur)" stroke="#6a2a8a" stroke-width="7" transform="rotate(-25 150 120)"/>
  <ellipse cx="362" cy="120" rx="66" ry="80" fill="url(#fur)" stroke="#6a2a8a" stroke-width="7" transform="rotate(25 362 120)"/>
  <ellipse cx="152" cy="124" rx="40" ry="54" fill="#f8bbd0" transform="rotate(-25 152 124)"/>
  <ellipse cx="360" cy="124" rx="40" ry="54" fill="#f8bbd0" transform="rotate(25 360 124)"/>
  <!-- round ball body -->
  <circle cx="256" cy="290" r="160" fill="url(#fur)" stroke="#6a2a8a" stroke-width="8"/>
  <path d="M120 250 q-14 10 -6 24 M392 250 q14 10 6 24 M150 380 q-10 14 4 22 M362 380 q10 14 -4 22" fill="none" stroke="#9c64b8" stroke-width="5" stroke-linecap="round"/>
  <!-- huge eyes -->
  <ellipse cx="196" cy="270" rx="44" ry="50" fill="url(#eye)" stroke="#4a0a3a" stroke-width="6"/>
  <ellipse cx="316" cy="270" rx="44" ry="50" fill="url(#eye)" stroke="#4a0a3a" stroke-width="6"/>
  <circle cx="182" cy="252" r="14" fill="#fff"/><circle cx="302" cy="252" r="14" fill="#fff"/>
  <circle cx="210" cy="290" r="6" fill="#fff"/><circle cx="330" cy="290" r="6" fill="#fff"/>
  <!-- nose, whiskers, smile -->
  <path d="M246 324 L266 324 L256 336 Z" fill="#ff80ab" stroke="#4a0a3a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M256 336 Q246 350 236 344 M256 336 Q266 350 276 344" fill="none" stroke="#4a0a3a" stroke-width="5" stroke-linecap="round"/>
  <path d="M220 330 L150 318 M220 340 L148 346 M292 330 L362 318 M292 340 L364 346" stroke="#6a2a8a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="160" cy="330" r="14" fill="#ff80ab" opacity=".55"/><circle cx="352" cy="330" r="14" fill="#ff80ab" opacity=".55"/>
  <!-- tiny paws -->
  <ellipse cx="210" cy="446" rx="26" ry="14" fill="#e1bee7" stroke="#6a2a8a" stroke-width="5"/>
  <ellipse cx="302" cy="446" rx="26" ry="14" fill="#e1bee7" stroke="#6a2a8a" stroke-width="5"/>
  <!-- blooming flower -->
  <circle cx="440" cy="420" r="10" fill="#fff59d"/><circle cx="440" cy="404" r="10" fill="#f48fb1"/><circle cx="456" cy="420" r="10" fill="#f48fb1"/><circle cx="440" cy="436" r="10" fill="#f48fb1"/><circle cx="424" cy="420" r="10" fill="#f48fb1"/><circle cx="440" cy="420" r="8" fill="#fff59d"/>
</svg>
