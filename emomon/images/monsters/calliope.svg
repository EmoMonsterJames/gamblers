<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Calliope: a gigantic hollow circus balloon full of acoustic gas, with rows of brass pipes on its back and looping balloon ribbons -->
  <defs>
    <radialGradient id="body" cx="40%" cy="32%" r="70%"><stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#ff6a3a"/><stop offset="1" stop-color="#a81a3a"/></radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a10"/><stop offset=".4" stop-color="#ffe08a"/><stop offset="1" stop-color="#a8701a"/></linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe6b8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe6b8" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="236" fill="url(#aura)"/>
  <!-- brass calliope pipes on its back -->
  <g stroke="#5a3a00" stroke-width="5">
    <rect x="150" y="70" width="28" height="110" rx="6" fill="url(#brass)"/><rect x="186" y="44" width="28" height="130" rx="6" fill="url(#brass)"/>
    <rect x="222" y="30" width="28" height="140" rx="6" fill="url(#brass)"/><rect x="258" y="30" width="28" height="140" rx="6" fill="url(#brass)"/>
    <rect x="294" y="44" width="28" height="130" rx="6" fill="url(#brass)"/><rect x="330" y="70" width="28" height="110" rx="6" fill="url(#brass)"/>
  </g>
  <!-- music puffing out -->
  <g fill="#5a2a8a"><text x="110" y="70" font-size="44" font-family="serif">♪</text><text x="380" y="56" font-size="50" font-family="serif">♫</text><text x="420" y="130" font-size="36" font-family="serif">♪</text></g>
  <!-- looping balloon ribbons -->
  <path d="M110 330 C40 300 40 400 100 380 C150 364 120 300 70 330 C20 360 50 440 110 430" fill="none" stroke="#3ad8ff" stroke-width="12" stroke-linecap="round"/>
  <path d="M402 330 C472 300 472 400 412 380 C362 364 392 300 442 330 C492 360 462 440 402 430" fill="none" stroke="#7aff6a" stroke-width="12" stroke-linecap="round"/>
  <!-- huge body -->
  <ellipse cx="256" cy="300" rx="176" ry="150" fill="url(#body)" stroke="#5a0a1a" stroke-width="9"/>
  <path d="M110 260 Q256 230 402 260 M96 320 Q256 290 416 320 M110 380 Q256 352 402 380" fill="none" stroke="#ffe14d" stroke-width="7" opacity=".8"/>
  <ellipse cx="190" cy="214" rx="54" ry="26" fill="#fff" opacity=".45" transform="rotate(-20 190 214)"/>
  <!-- circus face -->
  <ellipse cx="212" cy="286" rx="26" ry="30" fill="#fff" stroke="#3a0010" stroke-width="5"/><ellipse cx="300" cy="286" rx="26" ry="30" fill="#fff" stroke="#3a0010" stroke-width="5"/>
  <circle cx="216" cy="294" r="12" fill="#1a1a2a"/><circle cx="296" cy="294" r="12" fill="#1a1a2a"/>
  <circle cx="220" cy="288" r="4" fill="#fff"/><circle cx="300" cy="288" r="4" fill="#fff"/>
  <path d="M190 250 l20 -10 l20 10 M282 250 l20 -10 l20 10" fill="none" stroke="#3a0010" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="256" cy="372" rx="40" ry="30" fill="#5a0a1a" stroke="#3a0010" stroke-width="5"/>
  <ellipse cx="256" cy="380" rx="22" ry="12" fill="#ff7a9a"/>
  <!-- updraft gust beneath -->
  <path d="M190 474 q10 -20 0 -40 M256 484 q10 -20 0 -40 M322 474 q10 -20 0 -40" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
</svg>
