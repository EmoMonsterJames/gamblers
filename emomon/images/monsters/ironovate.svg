<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ironovate: an upright helper robot on one heavy unicycle wheel, blue multi-lens visor, telescoping piston arms -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#78909c"/><stop offset=".45" stop-color="#eceff1"/><stop offset="1" stop-color="#607d8b"/></linearGradient>
    <radialGradient id="lens" cx="40%" cy="35%" r="60%"><stop offset="0" stop-color="#e1f5fe"/><stop offset=".5" stop-color="#29b6f6"/><stop offset="1" stop-color="#01579b"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b3e5fc" stop-opacity=".6"/><stop offset="1" stop-color="#b3e5fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#102030" stop-opacity=".4"/><stop offset="1" stop-color="#102030" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="246" r="236" fill="url(#aura)"/>
  <ellipse cx="256" cy="478" rx="90" ry="12" fill="url(#sh)"/>
  <!-- unicycle wheel -->
  <circle cx="256" cy="420" r="54" fill="#37474f" stroke="#1a2228" stroke-width="8"/>
  <circle cx="256" cy="420" r="26" fill="url(#steel)" stroke="#1a2228" stroke-width="6"/>
  <path d="M256 366 v108 M202 420 h108" stroke="#1a2228" stroke-width="5"/>
  <rect x="238" y="330" width="36" height="60" fill="url(#steel)" stroke="#263238" stroke-width="6"/>
  <!-- torso -->
  <path d="M170 196 L342 196 L330 340 L182 340 Z" fill="url(#steel)" stroke="#263238" stroke-width="8" stroke-linejoin="round"/>
  <rect x="210" y="236" width="92" height="56" rx="8" fill="#263238"/>
  <rect x="220" y="246" width="20" height="10" fill="#4fc3f7"/><rect x="246" y="246" width="20" height="10" fill="#81c784"/><rect x="272" y="246" width="20" height="10" fill="#4fc3f7"/>
  <path d="M220 270 h72 M220 280 h50" stroke="#4fc3f7" stroke-width="4"/>
  <circle cx="190" cy="214" r="6" fill="#263238"/><circle cx="322" cy="214" r="6" fill="#263238"/><circle cx="196" cy="322" r="6" fill="#263238"/><circle cx="316" cy="322" r="6" fill="#263238"/>
  <!-- telescoping piston arms -->
  <rect x="96" y="216" width="80" height="26" rx="6" fill="url(#steel)" stroke="#263238" stroke-width="6"/>
  <rect x="60" y="220" width="44" height="18" rx="4" fill="#90a4ae" stroke="#263238" stroke-width="5"/>
  <path d="M40 210 L64 222 L64 236 L40 248 Z" fill="#455a64" stroke="#263238" stroke-width="5"/>
  <rect x="336" y="216" width="80" height="26" rx="6" fill="url(#steel)" stroke="#263238" stroke-width="6"/>
  <rect x="408" y="220" width="44" height="18" rx="4" fill="#90a4ae" stroke="#263238" stroke-width="5"/>
  <rect x="446" y="206" width="30" height="46" rx="4" fill="#455a64" stroke="#263238" stroke-width="5"/>
  <!-- metal barrier sheet -->
  <path d="M480 180 L506 186 L506 280 L480 286 Z" fill="#b0bec5" stroke="#263238" stroke-width="4" opacity=".85"/>
  <!-- head with multi-lens visor -->
  <rect x="186" y="80" width="140" height="110" rx="26" fill="url(#steel)" stroke="#263238" stroke-width="8"/>
  <rect x="198" y="106" width="116" height="52" rx="22" fill="#102a43" stroke="#263238" stroke-width="5"/>
  <circle cx="226" cy="132" r="16" fill="url(#lens)"/><circle cx="286" cy="132" r="16" fill="url(#lens)"/><circle cx="256" cy="140" r="9" fill="url(#lens)"/>
  <circle cx="221" cy="126" r="5" fill="#fff"/><circle cx="281" cy="126" r="5" fill="#fff"/>
  <path d="M232 172 Q256 180 280 172" fill="none" stroke="#263238" stroke-width="5" stroke-linecap="round"/>
  <path d="M256 80 L256 52" stroke="#263238" stroke-width="6"/><circle cx="256" cy="46" r="10" fill="#4fc3f7" stroke="#263238" stroke-width="4"/>
</svg>
