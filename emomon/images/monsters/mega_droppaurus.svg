<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <radialGradient id="water" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#b4e6ff"/>
      <stop offset="50%" stop-color="#3f97de"/>
      <stop offset="100%" stop-color="#173f8e"/>
    </radialGradient>
    <radialGradient id="belly" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e6f3ff"/>
      <stop offset="65%" stop-color="#9cc6ef"/>
      <stop offset="100%" stop-color="#5b8fd2"/>
    </radialGradient>
    <linearGradient id="fin" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2f7ad0" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#bfe6ff"/>
    </linearGradient>
    <radialGradient id="drop" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#5fb0ee"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a3f8a" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#2a3f8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bub" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#a9dcff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#3f8fe0" stop-opacity=".8"/>
    </radialGradient>
    <g id="b"><circle r="10" fill="url(#bub)" stroke="#3f8fe0" stroke-width="1.5"/><circle cx="-3.5" cy="-3.5" r="2.5" fill="#fff"/></g>
    <path id="spike" d="M-14 0 C-10 -22 -3 -38 5 -52 C8 -34 12 -18 15 0 Z" fill="url(#fin)" stroke="#123a80" stroke-width="2.5"/>
    <path id="claw" d="M-7 0 L0 26 L7 0 Z" fill="#e3f0ff" stroke="#123a80" stroke-width="2"/>
  </defs>

  <!-- legendary glow -->
  <ellipse cx="256" cy="280" rx="230" ry="210" fill="#5fc2ff" opacity=".3" filter="url(#blur)"/>
  <ellipse cx="256" cy="488" rx="200" ry="18" fill="url(#shadow)"/>

  <!-- spikes on the back / shoulders -->
  <use xlink:href="#spike" transform="translate(70 230) rotate(-60)"/>
  <use xlink:href="#spike" transform="translate(60 300) rotate(-80)"/>
  <use xlink:href="#spike" transform="translate(442 230) rotate(60)"/>
  <use xlink:href="#spike" transform="translate(452 300) rotate(80)"/>
  <use xlink:href="#spike" transform="translate(150 132) rotate(-25)"/>
  <use xlink:href="#spike" transform="translate(362 132) rotate(25)"/>

  <!-- massive legs -->
  <path d="M110 370 C86 410 92 460 124 478 L226 478 C240 450 236 410 216 380 Z" fill="url(#water)" stroke="#123a80" stroke-width="3"/>
  <path d="M402 370 C426 410 420 460 388 478 L286 478 C272 450 276 410 296 380 Z" fill="url(#water)" stroke="#123a80" stroke-width="3"/>
  <g fill="#cfe4fb" stroke="#123a80" stroke-width="2">
    <ellipse cx="140" cy="478" rx="14" ry="8"/><ellipse cx="174" cy="482" rx="14" ry="8"/><ellipse cx="208" cy="478" rx="14" ry="8"/>
    <ellipse cx="304" cy="478" rx="14" ry="8"/><ellipse cx="338" cy="482" rx="14" ry="8"/><ellipse cx="372" cy="478" rx="14" ry="8"/>
  </g>

  <!-- huge torso -->
  <path d="M256 150 C340 150 420 180 440 250 C456 320 440 400 400 440 C360 470 300 478 256 478 C212 478 152 470 112 440 C72 400 56 320 72 250 C92 180 172 150 256 150 Z"
        fill="url(#water)" stroke="#123a80" stroke-width="4" stroke-linejoin="round"/>
  <!-- chest plates and giant belly -->
  <path d="M168 200 C200 186 246 196 252 226 C250 254 214 266 180 258 C156 250 150 214 168 200 Z" fill="url(#belly)" stroke="#5b8fd2" stroke-width="2"/>
  <path d="M344 200 C312 186 266 196 260 226 C262 254 298 266 332 258 C356 250 362 214 344 200 Z" fill="url(#belly)" stroke="#5b8fd2" stroke-width="2"/>
  <ellipse cx="256" cy="372" rx="132" ry="96" fill="url(#belly)" stroke="#5b8fd2" stroke-width="2"/>
  <ellipse cx="214" cy="330" rx="48" ry="20" fill="#fff" opacity=".55" transform="rotate(-12 214 330)"/>
  <path d="M256 418 q-6 8 0 12" fill="none" stroke="#5b8fd2" stroke-width="3" stroke-linecap="round"/>

  <!-- small dome head -->
  <circle cx="256" cy="128" r="72" fill="url(#water)" stroke="#123a80" stroke-width="4"/>
  <ellipse cx="228" cy="96" rx="26" ry="14" fill="#fff" opacity=".7" transform="rotate(-25 228 96)"/>
  <!-- calm, steady face -->
  <ellipse cx="228" cy="134" rx="9" ry="11" fill="#0b1638"/>
  <ellipse cx="284" cy="134" rx="9" ry="11" fill="#0b1638"/>
  <circle cx="225" cy="130" r="3" fill="#fff"/><circle cx="281" cy="130" r="3" fill="#fff"/>
  <path d="M214 116 l26 4 M298 116 l-26 4" stroke="#0b1638" stroke-width="4" stroke-linecap="round"/>
  <path d="M238 164 q9 7 18 0 q9 7 18 0" fill="none" stroke="#0b1638" stroke-width="3.5" stroke-linecap="round"/>

  <!-- droplet necklace -->
  <g stroke="#123a80" stroke-width="1.5" fill="url(#drop)">
    <circle cx="190" cy="186" r="8"/><circle cx="208" cy="196" r="8"/><circle cx="228" cy="202" r="8"/><circle cx="248" cy="205" r="8"/>
    <circle cx="268" cy="205" r="8"/><circle cx="288" cy="202" r="8"/><circle cx="308" cy="196" r="8"/><circle cx="326" cy="186" r="8"/>
  </g>

  <!-- huge arms -->
  <path d="M110 210 C60 230 40 300 50 370 C56 400 92 404 104 380 C116 340 124 300 150 266 Z" fill="url(#water)" stroke="#123a80" stroke-width="3"/>
  <path d="M402 210 C452 230 472 300 462 370 C456 400 420 404 408 380 C396 340 388 300 362 266 Z" fill="url(#water)" stroke="#123a80" stroke-width="3"/>
  <ellipse cx="82" cy="250" rx="22" ry="12" fill="#fff" opacity=".5" transform="rotate(-50 82 250)"/>
  <ellipse cx="430" cy="250" rx="22" ry="12" fill="#fff" opacity=".5" transform="rotate(50 430 250)"/>
  <use xlink:href="#claw" transform="translate(58 384) rotate(15)"/><use xlink:href="#claw" transform="translate(76 392)"/><use xlink:href="#claw" transform="translate(96 388) rotate(-15)"/>
  <use xlink:href="#claw" transform="translate(454 384) rotate(-15)"/><use xlink:href="#claw" transform="translate(436 392)"/><use xlink:href="#claw" transform="translate(416 388) rotate(15)"/>
  <use xlink:href="#spike" transform="translate(54 320) rotate(-100) scale(.7)"/>
  <use xlink:href="#spike" transform="translate(458 320) rotate(100) scale(.7)"/>

  <!-- bubbles -->
  <use xlink:href="#b" transform="translate(120 70) scale(1.3)"/>
  <use xlink:href="#b" transform="translate(400 60) scale(1.1)"/>
  <use xlink:href="#b" transform="translate(30 180) scale(1)"/>
  <use xlink:href="#b" transform="translate(484 170) scale(1.2)"/>
  <use xlink:href="#b" transform="translate(480 440) scale(.9)"/>
</svg>
