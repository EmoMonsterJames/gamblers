<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Kangpow: a kangaroo in red boxing gloves, ready to fight -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0a066"/><stop offset="1" stop-color="#b06a32"/></linearGradient>
    <radialGradient id="glove" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ff8a80"/><stop offset=".6" stop-color="#e53935"/><stop offset="1" stop-color="#8e0000"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe0b2" stop-opacity=".6"/><stop offset="1" stop-color="#ffe0b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3e2000" stop-opacity=".35"/><stop offset="1" stop-color="#3e2000" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="236" fill="url(#aura)"/>
  <ellipse cx="256" cy="462" rx="150" ry="16" fill="url(#sh)"/>
  <!-- tail -->
  <path d="M300 400 C360 410 420 420 470 450 C420 452 360 446 300 430 Z" fill="url(#fur)" stroke="#5d3412" stroke-width="7" stroke-linejoin="round"/>
