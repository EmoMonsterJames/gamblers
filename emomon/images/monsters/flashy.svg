  <path d="M170 400 L166 446 M262 400 L266 446" stroke="#3a3f4a" stroke-width="16" stroke-linecap="round"/>
  <!-- flashlight lying sideways -->
  <rect x="80" y="180" width="200" height="220" rx="40" fill="url(#body)" stroke="#8a6a00" stroke-width="6"/>
  <path d="M100 240 L260 240 M100 340 L260 340" stroke="#b8860a" stroke-width="5"/>
  <rect x="150" y="360" width="60" height="30" rx="10" fill="#e8322a" stroke="#8a1a10" stroke-width="4"/>
  <path d="M280 160 L340 140 L340 300 L280 280 Z" fill="url(#head)" stroke="#4a5262" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="340" cy="220" rx="18" ry="82" fill="#fffbe0" stroke="#4a5262" stroke-width="6"/>
  <!-- face on the body -->
  <ellipse cx="148" cy="282" rx="22" ry="26" fill="#2a1a04"/><ellipse cx="222" cy="282" rx="22" ry="26" fill="#2a1a04"/>
  <circle cx="155" cy="272" r="8" fill="#fff"/><circle cx="229" cy="272" r="8" fill="#fff"/>
  <ellipse cx="118" cy="316" rx="14" ry="8" fill="#ff9a7a" opacity=".8"/><ellipse cx="252" cy="316" rx="14" ry="8" fill="#ff9a7a" opacity=".8"/>
  <path d="M170 318 C178 330 194 330 202 318" fill="none" stroke="#2a1a04" stroke-width="5" stroke-linecap="round"/>
  <!-- arm holding strap -->
  <path d="M84 300 C50 300 40 330 54 352" fill="none" stroke="#e0a812" stroke-width="16" stroke-linecap="round"/>
  <path d="M100 180 C100 130 150 110 170 140" fill="none" stroke="#3a3f4a" stroke-width="8"/>
  <g fill="#fff6a0"><path d="M410 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/><path d="M450 280 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/></g>
