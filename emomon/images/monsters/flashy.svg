<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe26a"/><stop offset="100%" stop-color="#e0a812"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9aa3b2"/><stop offset="50%" stop-color="#eef2f8"/><stop offset="100%" stop-color="#7a8496"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff8c0" stop-opacity=".95"/><stop offset="100%" stop-color="#fff8c0" stop-opacity="0"/></linearGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3a3a1a" stop-opacity=".3"/><stop offset="100%" stop-color="#3a3a1a" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="220" cy="470" rx="140" ry="14" fill="url(#sh)"/>
  <!-- light beam -->
  <path d="M330 170 L512 60 L512 360 L330 270 Z" fill="url(#beam)"/>
