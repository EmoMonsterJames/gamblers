<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="skin" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7fb2b6"/>
      <stop offset="60%" stop-color="#4c7b82"/>
      <stop offset="100%" stop-color="#2a4a52"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4c57"/>
      <stop offset="100%" stop-color="#0f2129"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c5e66"/>
      <stop offset="100%" stop-color="#1f3740"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d9f6ff"/>
      <stop offset="75%" stop-color="#7fd3ff"/>
      <stop offset="100%" stop-color="#ff3d6e"/>
    </radialGradient>
  </defs>

  <!-- dark haze -->
  <ellipse cx="256" cy="300" rx="230" ry="190" fill="#16323b" opacity=".35" filter="url(#haze)"/>

  <!-- shadow flames rising around it -->
  <g fill="url(#smoke)">
    <path d="M60 330 C40 260 70 200 50 140 C90 180 100 230 110 270 C110 210 130 160 120 100 C160 150 170 220 160 290 Z"/>
    <path d="M452 330 C472 260 442 200 462 140 C422 180 412 230 402 270 C402 210 382 160 392 100 C352 150 342 220 352 290 Z"/>
    <path d="M140 250 C130 190 150 140 140 90 C175 130 185 180 180 240 Z"/>
    <path d="M372 250 C382 190 362 140 372 90 C337 130 327 180 332 240 Z"/>
    <path d="M30 420 C10 380 30 350 20 310 C60 340 70 380 70 420 Z"/>
    <path d="M482 420 C502 380 482 350 492 310 C452 340 442 380 442 420 Z"/>
  </g>
  <g fill="#0f2129">
    <circle cx="70" cy="90" r="6"/><circle cx="446" cy="96" r="7"/><circle cx="34" cy="250" r="5"/><circle cx="480" cy="240" r="5"/>
    <circle cx="40" cy="470" r="6"/><circle cx="470" cy="476" r="7"/><circle cx="256" cy="500" r="5"/>
  </g>

  <!-- hunched shadowy body / shoulders -->
  <path d="M90 340 C100 270 160 230 256 226 C352 230 412 270 422 340 Z" fill="url(#smoke)"/>
  <path d="M120 320 C140 290 170 270 200 262 M392 320 C372 290 342 270 312 262" fill="none" stroke="#3d6670" stroke-width="5" stroke-linecap="round"/>

  <!-- horns -->
  <path d="M190 120 C150 90 140 50 160 16 C166 50 186 76 214 96 Z" fill="#1b3640" stroke="#0b1a20" stroke-width="3"/>
  <path d="M322 120 C362 90 372 50 352 16 C346 50 326 76 298 96 Z" fill="#1b3640" stroke="#0b1a20" stroke-width="3"/>

  <!-- demon head -->
  <path d="M256 84 C312 84 340 120 338 170 C336 214 310 252 256 262 C202 252 176 214 174 170 C172 120 200 84 256 84 Z"
        fill="url(#skin)" stroke="#173038" stroke-width="3"/>
  <!-- spiky hair tuft -->
  <path d="M226 92 L236 62 L246 88 L256 56 L266 88 L276 62 L286 92 Z" fill="#1b3640"/>
  <!-- creased brow and cheeks -->
  <path d="M206 150 L248 164 M306 150 L264 164" stroke="#173038" stroke-width="6" stroke-linecap="round"/>
  <path d="M196 196 C206 210 214 214 222 214 M316 196 C306 210 298 214 290 214 M240 120 q16 -6 32 0" fill="none" stroke="#2f5560" stroke-width="3" stroke-linecap="round"/>

  <!-- glowing eyes -->
  <circle cx="226" cy="172" r="18" fill="#7fd3ff" opacity=".6" filter="url(#glow)"/>
  <circle cx="286" cy="172" r="18" fill="#7fd3ff" opacity=".6" filter="url(#glow)"/>
  <ellipse cx="226" cy="172" rx="14" ry="11" fill="url(#eye)"/>
  <ellipse cx="286" cy="172" rx="14" ry="11" fill="url(#eye)"/>
  <circle cx="226" cy="172" r="3.5" fill="#fff"/><circle cx="286" cy="172" r="3.5" fill="#fff"/>

  <!-- huge grin full of fangs -->
  <path d="M198 206 Q256 196 314 206 Q306 252 256 258 Q206 252 198 206 Z" fill="#3a0716"/>
  <path d="M214 236 Q256 226 298 236 Q284 254 256 256 Q228 254 214 236 Z" fill="#ff3d6e"/>
  <g fill="#ffe6ee">
    <path d="M202 207 l7 20 l7 -21 Z M218 205 l7 24 l7 -25 Z M235 203 l7 26 l7 -27 Z M252 203 l6 27 l6 -27 Z M266 203 l7 27 l7 -26 Z M283 204 l7 25 l7 -24 Z M299 206 l6 20 l6 -19 Z"/>
    <path d="M216 250 l6 -14 l6 15 Z M234 254 l6 -16 l6 16 Z M252 255 l6 -17 l6 17 Z M270 254 l6 -16 l6 16 Z M288 250 l6 -14 l5 13 Z"/>
  </g>

  <!-- the Ouija board -->
  <path d="M86 336 L426 336 L486 470 L26 470 Z" fill="url(#board)" stroke="#0b1a20" stroke-width="4" stroke-linejoin="round"/>
  <path d="M26 470 L486 470 L478 486 L34 486 Z" fill="#132830" stroke="#0b1a20" stroke-width="3"/>
  <path d="M104 348 L408 348 L460 460 L52 460 Z" fill="none" stroke="#6f969c" stroke-width="2" stroke-dasharray="6 6"/>
  <g fill="#e6f2f2" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">
    <text x="120" y="372" font-size="20">YES</text>
    <text x="392" y="372" font-size="20">NO</text>
    <text x="256" y="372" font-size="16" letter-spacing="2">☾ ✦ ☀</text>
    <text x="256" y="408" font-size="24" letter-spacing="4">ABCDEFGHIJKLM</text>
    <text x="256" y="440" font-size="26" letter-spacing="5">NOPQRSTUVWXYZ</text>
    <text x="256" y="462" font-size="15" letter-spacing="3">1 2 3 4 5 6 7 8 9 0</text>
  </g>
  <!-- planchette -->
  <path d="M236 384 C252 372 284 372 300 384 C304 398 292 412 268 416 C244 412 232 398 236 384 Z" fill="#c9dede" opacity=".9" stroke="#0b1a20" stroke-width="2.5"/>
  <circle cx="268" cy="392" r="7" fill="#1f3740" stroke="#0b1a20" stroke-width="2"/>

  <!-- clawed hands gripping the board -->
  <g fill="url(#skin)" stroke="#173038" stroke-width="3" stroke-linejoin="round">
    <path d="M110 300 C140 296 170 310 178 334 L170 352 C160 344 150 342 140 346 L130 360 C122 350 112 348 104 352 L96 340 C92 324 96 308 110 300 Z"/>
    <path d="M402 300 C372 296 342 310 334 334 L342 352 C352 344 362 342 372 346 L382 360 C390 350 400 348 408 352 L416 340 C420 324 416 308 402 300 Z"/>
  </g>
  <g fill="#e8f0f0" stroke="#173038" stroke-width="1.5">
    <path d="M170 350 l6 14 l2 -14 Z M130 358 l2 15 l5 -13 Z M98 338 l-4 14 l9 -10 Z M150 344 l3 14 l4 -13 Z"/>
    <path d="M342 350 l-6 14 l-2 -14 Z M382 358 l-2 15 l-5 -13 Z M414 338 l4 14 l-9 -10 Z M362 344 l-3 14 l-4 -13 Z"/>
  </g>
</svg>
