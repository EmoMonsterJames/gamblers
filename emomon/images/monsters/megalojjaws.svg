<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a5a7a"/><stop offset="50%" stop-color="#2a4460"/><stop offset="51%" stop-color="#c8d4de"/><stop offset="100%" stop-color="#8a9aaa"/></linearGradient>
    <radialGradient id="mouth" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#1a0006"/><stop offset="100%" stop-color="#6a0a1a"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000" stop-opacity=".45"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
