<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="fur" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff4e6"/>
      <stop offset="60%" stop-color="#f6c890"/>
      <stop offset="100%" stop-color="#d9955a"/>
    </radialGradient>
    <radialGradient id="eye" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b8f06a"/>
      <stop offset="60%" stop-color="#4a9a2a"/>
      <stop offset="100%" stop-color="#1e4a10"/>
    </radialGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd6e2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a4a3a" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#5a4a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="256" cy="476" rx="140" ry="16" fill="url(#shadow)"/>

  <!-- curly tail -->
  <path d="M340 410 C410 410 440 360 420 320 C406 296 380 304 386 324" fill="none" stroke="#e0a066" stroke-width="22" stroke-linecap="round"/>
  <path d="M352 404 C398 400 422 370 414 340" fill="none" stroke="#b8743a" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 14"/>

  <!-- body -->
  <ellipse cx="256" cy="380" rx="96" ry="88" fill="url(#fur)" stroke="#b8743a" stroke-width="3"/>
  <ellipse cx="256" cy="396" rx="56" ry="56" fill="#fff8ef"/>
  <!-- feet -->
  <ellipse cx="210" cy="460" rx="32" ry="16" fill="url(#fur)" stroke="#b8743a" stroke-width="3"/>
  <ellipse cx="302" cy="460" rx="32" ry="16" fill="url(#fur)" stroke="#b8743a" stroke-width="3"/>

  <!-- head -->
  <path d="M140 140 L170 60 L230 116 Z" fill="url(#fur)" stroke="#b8743a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M372 140 L342 60 L282 116 Z" fill="url(#fur)" stroke="#b8743a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M160 124 L174 84 L204 112 Z M352 124 L338 84 L308 112 Z" fill="#ffb3c4"/>
  <ellipse cx="256" cy="200" rx="128" ry="108" fill="url(#fur)" stroke="#b8743a" stroke-width="3"/>
  <!-- stripes -->
  <path d="M236 98 l6 30 M256 94 l0 32 M276 98 l-6 30" stroke="#c87a3a" stroke-width="7" stroke-linecap="round"/>
  <!-- big eyes -->
  <ellipse cx="208" cy="200" rx="28" ry="32" fill="#fff" stroke="#5a3a1a" stroke-width="3"/>
  <ellipse cx="304" cy="200" rx="28" ry="32" fill="#fff" stroke="#5a3a1a" stroke-width="3"/>
  <ellipse cx="210" cy="206" rx="18" ry="24" fill="url(#eye)"/>
  <ellipse cx="302" cy="206" rx="18" ry="24" fill="url(#eye)"/>
  <ellipse cx="210" cy="206" rx="6" ry="16" fill="#0e1e06"/>
  <ellipse cx="302" cy="206" rx="6" ry="16" fill="#0e1e06"/>
  <circle cx="202" cy="192" r="6" fill="#fff"/><circle cx="294" cy="192" r="6" fill="#fff"/>
  <!-- nose, mouth, whiskers, blush -->
  <path d="M248 238 L264 238 L256 248 Z" fill="#ff8fa3"/>
  <path d="M256 248 Q248 262 236 256 M256 248 Q264 262 276 256" fill="none" stroke="#5a3a1a" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 244 L130 236 M190 254 L132 260 M322 244 L382 236 M322 254 L380 260" stroke="#5a3a1a" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="176" cy="240" rx="14" ry="7" fill="#ff9fb6" opacity=".55"/>
  <ellipse cx="336" cy="240" rx="14" ry="7" fill="#ff9fb6" opacity=".55"/>

  <!-- raised paws with LONG sharp claws -->
  <circle cx="150" cy="330" r="30" fill="url(#fur)" stroke="#b8743a" stroke-width="3"/>
  <circle cx="362" cy="330" r="30" fill="url(#fur)" stroke="#b8743a" stroke-width="3"/>
  <g fill="url(#claw)" stroke="#8a94a6" stroke-width="2" stroke-linejoin="round">
    <path d="M128 312 L92 248 L140 304 Z"/>
    <path d="M142 302 L124 228 L156 298 Z"/>
    <path d="M160 302 L164 226 L172 304 Z"/>
    <path d="M384 312 L420 248 L372 304 Z"/>
    <path d="M370 302 L388 228 L356 298 Z"/>
    <path d="M352 302 L348 226 L340 304 Z"/>
  </g>
  <g fill="#ffb3c4"><circle cx="150" cy="336" r="8"/><circle cx="362" cy="336" r="8"/></g>

  <!-- shine on the claws -->
  <path d="M100 250 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z M412 250 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z" fill="#fff6c0"/>
</svg>
