<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="water" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#bfe8ff"/>
      <stop offset="50%" stop-color="#5fb4f0"/>
      <stop offset="100%" stop-color="#1f5fbf"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6fc6ff"/>
      <stop offset="60%" stop-color="#1d5bb8"/>
      <stop offset="100%" stop-color="#0b2a66"/>
    </radialGradient>
    <radialGradient id="bub" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#a9dcff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#3f8fe0" stop-opacity=".8"/>
    </radialGradient>
    <g id="b"><circle r="10" fill="url(#bub)" stroke="#3f8fe0" stroke-width="1.5"/><circle cx="-3.5" cy="-3.5" r="2.5" fill="#fff"/></g>
  </defs>

  <!-- drop body -->
  <path d="M256 70 C276 120 330 170 368 228 C396 270 404 314 392 352 C372 418 316 452 256 452 C196 452 140 418 120 352 C108 314 116 270 144 228 C182 170 236 120 256 70 Z"
        fill="url(#water)" stroke="#1a4fa8" stroke-width="4" stroke-linejoin="round"/>
  <!-- inner swirl lines near the bottom -->
  <g fill="none" stroke="#1d57b0" stroke-width="4" stroke-linecap="round" opacity=".55">
    <path d="M140 360 C190 392 320 392 372 360"/>
    <path d="M156 396 C206 424 306 424 356 396"/>
  </g>
  <!-- shine -->
  <path d="M206 160 C186 196 170 230 168 262" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".75"/>
  <ellipse cx="342" cy="252" rx="16" ry="30" fill="#fff" opacity=".55" transform="rotate(-20 342 252)"/>
  <g fill="#fff" opacity=".85"><circle cx="232" cy="160" r="4"/><circle cx="300" cy="210" r="3"/><circle cx="180" cy="300" r="3"/><circle cx="330" cy="330" r="3.5"/></g>

  <!-- big sparkly eyes -->
  <ellipse cx="208" cy="282" rx="27" ry="31" fill="#fff" stroke="#1a4fa8" stroke-width="3"/>
  <ellipse cx="304" cy="282" rx="27" ry="31" fill="#fff" stroke="#1a4fa8" stroke-width="3"/>
  <ellipse cx="210" cy="286" rx="18" ry="22" fill="url(#eye)"/>
  <ellipse cx="302" cy="286" rx="18" ry="22" fill="url(#eye)"/>
  <ellipse cx="204" cy="276" rx="8" ry="9" fill="#fff"/><ellipse cx="296" cy="276" rx="8" ry="9" fill="#fff"/>
  <circle cx="216" cy="296" r="3.5" fill="#fff"/><circle cx="308" cy="296" r="3.5" fill="#fff"/>

  <!-- little open mouth -->
  <path d="M242 322 Q256 314 270 322 Q268 344 256 346 Q244 344 242 322 Z" fill="#ff8fa3" stroke="#a83a52" stroke-width="2.5"/>

  <!-- bubbles -->
  <use xlink:href="#b" transform="translate(110 200) scale(1.6)"/>
  <use xlink:href="#b" transform="translate(420 170) scale(1.3)"/>
  <use xlink:href="#b" transform="translate(96 330) scale(1.2)"/>
  <use xlink:href="#b" transform="translate(424 360) scale(1.1)"/>
  <use xlink:href="#b" transform="translate(380 90) scale(.8)"/>
  <use xlink:href="#b" transform="translate(140 460) scale(1.3)"/>
  <use xlink:href="#b" transform="translate(370 470) scale(.8)"/>
</svg>
