<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e99a8"/>
      <stop offset="35%" stop-color="#eef2f7"/>
      <stop offset="65%" stop-color="#c3cbd6"/>
      <stop offset="100%" stop-color="#6f7a8a"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#a8b2c0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a4258" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#3a4258" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="256" cy="476" rx="110" ry="14" fill="url(#shadow)"/>

