<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="moon" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="55%" stop-color="#ffe98a"/>
      <stop offset="100%" stop-color="#f2c14e"/>
    </radialGradient>
    <path id="star" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
  </defs>

  <!-- soft moonlight -->
  <path d="M300 70 C190 80 120 170 120 270 C120 370 200 448 300 450 C252 412 240 340 240 262 C240 180 258 110 300 70 Z"
        fill="#ffe27a" opacity=".55" filter="url(#glow)"/>

  <!-- crescent body -->
  <path d="M300 70 C190 80 120 170 120 270 C120 370 200 448 300 450 C252 412 240 340 240 262 C240 180 258 110 300 70 Z"
        fill="url(#moon)" stroke="#d9a53a" stroke-width="4" stroke-linejoin="round"/>
  <!-- craters -->
  <g fill="#f0c95a" opacity=".7">
    <circle cx="200" cy="150" r="10"/><circle cx="150" cy="340" r="9"/><circle cx="214" cy="392" r="11"/>
  </g>
  <path d="M230 106 C190 130 160 170 148 214" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".75"/>

  <!-- cute face -->
  <path d="M146 250 q10 -11 20 0" fill="none" stroke="#6b4a10" stroke-width="5" stroke-linecap="round"/>
  <path d="M190 250 q10 -11 20 0" fill="none" stroke="#6b4a10" stroke-width="5" stroke-linecap="round"/>
  <path d="M168 274 q10 10 20 0" fill="none" stroke="#6b4a10" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="140" cy="276" rx="12" ry="7" fill="#ff9fb6" opacity=".6"/>
  <ellipse cx="218" cy="276" rx="12" ry="7" fill="#ff9fb6" opacity=".6"/>

  <!-- little nightcap-style star on its tip and twinkles -->
  <use href="#star" transform="translate(306 66) scale(1.3)" fill="#fff4b0" stroke="#d9a53a" stroke-width="1.5"/>
  <use href="#star" transform="translate(340 200) scale(1.6)" fill="#fff4b0"/>
  <use href="#star" transform="translate(370 330)" fill="#fff4b0"/>
  <use href="#star" transform="translate(310 300) scale(.7)" fill="#fff4b0"/>
  <circle cx="390" cy="250" r="4" fill="#fff4b0"/><circle cx="100" cy="130" r="4" fill="#fff4b0"/><circle cx="90" cy="400" r="5" fill="#fff4b0"/>
</svg>
