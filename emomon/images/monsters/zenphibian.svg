<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Zenphibian: a plump frog sitting cross-legged on a water-lily pad, eyes closed, a necklace of floating stones -->
  <defs>
    <radialGradient id="skin" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#b9f6ca"/><stop offset=".6" stop-color="#26a69a"/><stop offset="1" stop-color="#00695c"/></radialGradient>
    <radialGradient id="pad" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#9ccc65"/><stop offset="1" stop-color="#33691e"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d1c4e9" stop-opacity=".75"/><stop offset="1" stop-color="#b2dfdb" stop-opacity="0"/></radialGradient>
    <radialGradient id="stone" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#f3e5f5"/><stop offset="1" stop-color="#7e57c2"/></radialGradient>
  </defs>
  <circle cx="256" cy="246" r="240" fill="url(#aura)"/>
  <!-- water ripples -->
  <ellipse cx="256" cy="440" rx="220" ry="34" fill="none" stroke="#80deea" stroke-width="4" opacity=".7"/>
  <ellipse cx="256" cy="440" rx="180" ry="24" fill="#4dd0e1" opacity=".35"/>
  <!-- lily pad with a notch + flower -->
  <path d="M256 436 L120 420 C70 410 70 384 120 376 C190 364 322 364 392 376 C442 384 442 410 392 420 Z" fill="url(#pad)" stroke="#1b5e20" stroke-width="6"/>
  <path d="M256 436 L236 396 L276 396 Z" fill="#4dd0e1" opacity=".6"/>
  <g transform="translate(410 380)"><ellipse cx="0" cy="-10" rx="8" ry="16" fill="#f8bbd0" stroke="#ad1457" stroke-width="2"/><ellipse cx="-12" cy="-4" rx="8" ry="14" fill="#f8bbd0" stroke="#ad1457" stroke-width="2" transform="rotate(-40)"/><ellipse cx="12" cy="-4" rx="8" ry="14" fill="#f8bbd0" stroke="#ad1457" stroke-width="2" transform="rotate(40)"/></g>
  <!-- crossed legs -->
  <ellipse cx="196" cy="384" rx="80" ry="30" fill="url(#skin)" stroke="#004d40" stroke-width="7"/>
  <ellipse cx="316" cy="384" rx="80" ry="30" fill="url(#skin)" stroke="#004d40" stroke-width="7"/>
  <path d="M120 392 l-14 10 M120 392 l-6 16 M392 392 l14 10 M392 392 l6 16" stroke="#004d40" stroke-width="7" stroke-linecap="round"/>
  <!-- plump body -->
  <ellipse cx="256" cy="290" rx="130" ry="110" fill="url(#skin)" stroke="#004d40" stroke-width="8"/>
  <ellipse cx="256" cy="318" rx="84" ry="66" fill="#e0f2f1"/>
  <!-- hands in a meditation pose resting on the knees -->
  <ellipse cx="150" cy="350" rx="26" ry="18" fill="url(#skin)" stroke="#004d40" stroke-width="6"/>
  <ellipse cx="362" cy="350" rx="26" ry="18" fill="url(#skin)" stroke="#004d40" stroke-width="6"/>
  <circle cx="140" cy="346" r="5" fill="#004d40"/><circle cx="372" cy="346" r="5" fill="#004d40"/>
  <!-- head bumps / eyes closed -->
  <circle cx="200" cy="190" r="40" fill="url(#skin)" stroke="#004d40" stroke-width="7"/>
  <circle cx="312" cy="190" r="40" fill="url(#skin)" stroke="#004d40" stroke-width="7"/>
  <path d="M182 194 Q200 208 218 194 M294 194 Q312 208 330 194" fill="none" stroke="#004d40" stroke-width="6" stroke-linecap="round"/>
  <path d="M220 246 Q256 266 292 246" fill="none" stroke="#004d40" stroke-width="6" stroke-linecap="round"/>
  <circle cx="186" cy="236" r="10" fill="#f48fb1" opacity=".6"/><circle cx="326" cy="236" r="10" fill="#f48fb1" opacity=".6"/>
  <!-- floating stone necklace (stones hover, not strung) -->
  <ellipse cx="256" cy="282" rx="104" ry="26" fill="none" stroke="#b39ddb" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="164" cy="288" r="13" fill="url(#stone)" stroke="#4527a0" stroke-width="3"/>
  <circle cx="206" cy="304" r="14" fill="url(#stone)" stroke="#4527a0" stroke-width="3"/>
  <circle cx="256" cy="310" r="17" fill="url(#stone)" stroke="#4527a0" stroke-width="3"/>
  <circle cx="306" cy="304" r="14" fill="url(#stone)" stroke="#4527a0" stroke-width="3"/>
  <circle cx="348" cy="288" r="13" fill="url(#stone)" stroke="#4527a0" stroke-width="3"/>
  <circle cx="256" cy="310" r="6" fill="#fff" opacity=".7"/>
  <!-- calm glow above head -->
  <ellipse cx="256" cy="120" rx="70" ry="14" fill="none" stroke="#b388ff" stroke-width="5" opacity=".8"/>
</svg>
