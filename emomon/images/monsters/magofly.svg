<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="body" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8a8f9a"/>
      <stop offset="55%" stop-color="#4b505c"/>
      <stop offset="100%" stop-color="#22252c"/>
    </radialGradient>
    <radialGradient id="eye" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff8f8f"/>
      <stop offset="55%" stop-color="#d42a3a"/>
      <stop offset="100%" stop-color="#6e0f1c"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#bfe3ff" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="facets" width="12" height="11" patternUnits="userSpaceOnUse">
      <path d="M0 5.5 L3 0 L9 0 L12 5.5 L9 11 L3 11 Z" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="256" cy="478" rx="150" ry="18" fill="url(#shadow)"/>

  <!-- wings (behind) -->
  <g stroke="#9cc8ea" stroke-width="2.5">
    <path d="M222 230 C150 120 60 110 40 170 C26 220 110 262 214 262 Z" fill="url(#wing)"/>
    <path d="M290 230 C362 120 452 110 472 170 C486 220 402 262 298 262 Z" fill="url(#wing)"/>
  </g>
  <g fill="none" stroke="#9cc8ea" stroke-width="2" opacity=".9">
    <path d="M214 246 C160 200 100 170 56 168 M200 236 C150 160 110 140 84 132 M210 256 C150 250 100 230 64 208"/>
    <path d="M298 246 C352 200 412 170 456 168 M312 236 C362 160 402 140 428 132 M302 256 C362 250 412 230 448 208"/>
  </g>

  <!-- legs -->
  <g fill="none" stroke="#2a2d34" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 390 L160 420 L150 462"/><path d="M230 410 L214 450 L222 476"/>
    <path d="M312 390 L352 420 L362 462"/><path d="M282 410 L298 450 L290 476"/>
  </g>

  <!-- chubby striped abdomen -->
  <ellipse cx="256" cy="360" rx="96" ry="88" fill="url(#body)" stroke="#1a1c22" stroke-width="3"/>
  <g fill="none" stroke="#2c3038" stroke-width="10" stroke-linecap="round" opacity=".8">
    <path d="M172 342 C220 362 292 362 340 342"/>
    <path d="M180 384 C224 402 288 402 332 384"/>
  </g>
  <g fill="#9aa0ab" opacity=".55">
    <circle cx="196" cy="318" r="3"/><circle cx="300" cy="312" r="3"/><circle cx="230" cy="420" r="3"/><circle cx="296" cy="414" r="3"/>
  </g>

  <!-- head -->
  <circle cx="256" cy="226" r="92" fill="url(#body)" stroke="#1a1c22" stroke-width="3"/>
  <!-- fuzzy bristles -->
  <g stroke="#1a1c22" stroke-width="3" stroke-linecap="round">
    <path d="M230 138 l-6 -18 M256 134 l0 -20 M282 138 l6 -18"/>
  </g>

  <!-- huge cute compound eyes -->
  <ellipse cx="196" cy="214" rx="56" ry="62" fill="url(#eye)" stroke="#5a0c16" stroke-width="3"/>
  <ellipse cx="316" cy="214" rx="56" ry="62" fill="url(#eye)" stroke="#5a0c16" stroke-width="3"/>
  <ellipse cx="196" cy="214" rx="56" ry="62" fill="url(#facets)"/>
  <ellipse cx="316" cy="214" rx="56" ry="62" fill="url(#facets)"/>
  <ellipse cx="178" cy="190" rx="18" ry="13" fill="#fff" opacity=".85" transform="rotate(-25 178 190)"/>
  <ellipse cx="298" cy="190" rx="18" ry="13" fill="#fff" opacity=".85" transform="rotate(-25 298 190)"/>
  <circle cx="212" cy="236" r="6" fill="#fff" opacity=".7"/><circle cx="332" cy="236" r="6" fill="#fff" opacity=".7"/>

  <!-- blush and little proboscis smile -->
  <ellipse cx="200" cy="292" rx="15" ry="7" fill="#ff9fb6" opacity=".6"/>
  <ellipse cx="312" cy="292" rx="15" ry="7" fill="#ff9fb6" opacity=".6"/>
  <path d="M240 284 Q256 298 272 284" fill="none" stroke="#14161b" stroke-width="4" stroke-linecap="round"/>
  <path d="M256 294 L256 312" stroke="#14161b" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="256" cy="316" rx="9" ry="6" fill="#3a3e47"/>
</svg>
