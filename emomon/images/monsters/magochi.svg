<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="silk" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1ece3"/>
      <stop offset="100%" stop-color="#cfc4b2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a3b33"/>
      <stop offset="100%" stop-color="#120c08"/>
    </radialGradient>
    <clipPath id="body"><path d="M256 70 C338 70 368 170 368 270 C368 380 320 450 256 450 C192 450 144 380 144 270 C144 170 174 70 256 70 Z"/></clipPath>
  </defs>

  <!-- silk thread it hangs from -->
  <path d="M256 6 C250 30 262 50 256 74" fill="none" stroke="#d8cfc0" stroke-width="3"/>

  <ellipse cx="256" cy="470" rx="110" ry="16" fill="url(#shadow)"/>

  <!-- cocoon -->
  <path d="M256 70 C338 70 368 170 368 270 C368 380 320 450 256 450 C192 450 144 380 144 270 C144 170 174 70 256 70 Z"
        fill="url(#silk)" stroke="#bfb29d" stroke-width="3"/>
  <!-- wrapped silk threads -->
  <g clip-path="url(#body)" fill="none" stroke="#d6ccbb" stroke-width="3" stroke-linecap="round">
    <path d="M130 120 C200 150 300 100 380 140"/>
    <path d="M130 160 C210 190 300 150 380 180"/>
    <path d="M130 300 C210 330 300 290 380 320"/>
    <path d="M130 340 C210 372 300 330 380 362"/>
    <path d="M130 382 C210 412 300 372 380 402"/>
    <path d="M130 420 C210 448 300 412 380 440"/>
    <path d="M150 100 C230 260 280 330 360 460" stroke-opacity=".6"/>
    <path d="M360 90 C290 240 240 340 160 460" stroke-opacity=".6"/>
  </g>
  <ellipse cx="208" cy="140" rx="26" ry="44" fill="#fff" opacity=".7" transform="rotate(15 208 140)"/>

  <!-- the gap in the silk where only the eyes peek out -->
  <path d="M168 214 C210 196 302 196 344 214 C344 262 302 276 256 276 C210 276 168 262 168 214 Z" fill="#3a2f28"/>
  <ellipse cx="216" cy="238" rx="25" ry="28" fill="#fff"/>
  <ellipse cx="296" cy="238" rx="25" ry="28" fill="#fff"/>
  <ellipse cx="222" cy="244" rx="14" ry="17" fill="url(#eye)"/>
  <ellipse cx="290" cy="244" rx="14" ry="17" fill="url(#eye)"/>
  <circle cx="226" cy="238" r="4.5" fill="#fff"/><circle cx="294" cy="238" r="4.5" fill="#fff"/>
  <!-- silk lip over the gap -->
  <path d="M164 214 C210 194 302 194 348 214" fill="none" stroke="#bfb29d" stroke-width="5" stroke-linecap="round"/>
  <path d="M168 262 C210 282 302 282 344 262" fill="none" stroke="#e8e0d2" stroke-width="7" stroke-linecap="round"/>
</svg>
