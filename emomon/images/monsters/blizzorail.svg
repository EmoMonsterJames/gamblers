  <path d="M70 410 L70 250 C70 200 110 170 160 170 L250 170 C290 170 300 200 300 240 L300 410 Z" fill="url(#steel)" stroke="#102027" stroke-width="9" stroke-linejoin="round"/>
  <path d="M70 360 L40 410 L70 410 Z" fill="#90a4ae" stroke="#102027" stroke-width="6" stroke-linejoin="round"/>
  <!-- ice horns -->
  <path d="M120 176 L100 100 L150 172 Z M240 172 L270 96 L272 178 Z" fill="url(#ice)" stroke="#01579b" stroke-width="6" stroke-linejoin="round"/>
  <!-- headlight eyes -->
  <circle cx="140" cy="262" r="32" fill="#fffde7" stroke="#102027" stroke-width="7"/><circle cx="236" cy="262" r="32" fill="#fffde7" stroke="#102027" stroke-width="7"/>
  <circle cx="146" cy="266" r="15" fill="#0277bd"/><circle cx="242" cy="266" r="15" fill="#0277bd"/>
  <circle cx="151" cy="260" r="5" fill="#fff"/><circle cx="247" cy="260" r="5" fill="#fff"/>
  <path d="M104 222 L170 238 M272 222 L206 238" stroke="#102027" stroke-width="8" stroke-linecap="round"/>
  <!-- grille mouth -->
  <rect x="130" y="320" width="120" height="44" rx="8" fill="#263238"/>
  <path d="M150 320 L150 364 M170 320 L170 364 M190 320 L190 364 M210 320 L210 364 M230 320 L230 364" stroke="#90a4ae" stroke-width="5"/>
  <circle cx="110" cy="412" r="22" fill="#263238" stroke="#102027" stroke-width="5"/><circle cx="250" cy="412" r="22" fill="#263238" stroke="#102027" stroke-width="5"/>
  <!-- pantograph spark -->
  <path d="M190 170 L170 120 L210 100" fill="none" stroke="#37474f" stroke-width="6"/>
  <path d="M210 100 L230 70 L220 72 L240 40" fill="none" stroke="url(#volt)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
