<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eceff1"/><stop offset="100%" stop-color="#607d8b"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#4fc3f7"/></linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff59d"/><stop offset="100%" stop-color="#ffb300"/></linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#b3e5fc" stop-opacity=".65"/><stop offset="100%" stop-color="#b3e5fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#102027" stop-opacity=".4"/><stop offset="100%" stop-color="#102027" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#aura)"/>
  <ellipse cx="256" cy="452" rx="220" ry="16" fill="url(#sh)"/>
  <!-- rails -->
  <path d="M30 440 L482 440 M30 424 L482 424" stroke="#455a64" stroke-width="8"/>
  <path d="M60 420 L60 446 M120 420 L120 446 M180 420 L180 446 M240 420 L240 446 M300 420 L300 446 M360 420 L360 446 M420 420 L420 446" stroke="#6d4c41" stroke-width="10"/>
