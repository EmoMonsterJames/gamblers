<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="water" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#c8f0ff"/>
      <stop offset="50%" stop-color="#5cc0ec"/>
      <stop offset="100%" stop-color="#2a74c4"/>
    </radialGradient>
    <radialGradient id="limb" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6aa8e6"/>
      <stop offset="100%" stop-color="#2a5ea8"/>
    </radialGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b5c9e"/>
      <stop offset="70%" stop-color="#0e1b42"/>
      <stop offset="100%" stop-color="#050b1e"/>
    </radialGradient>
    <radialGradient id="bub" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#a9dcff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#3f8fe0" stop-opacity=".8"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a52a0" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#3a52a0" stop-opacity="0"/>
    </radialGradient>
    <g id="b"><circle r="10" fill="url(#bub)" stroke="#3f8fe0" stroke-width="1.5"/><circle cx="-3.5" cy="-3.5" r="2.5" fill="#fff"/></g>
    <clipPath id="clip"><path d="M256 44 C300 80 362 170 382 260 C398 340 380 420 256 432 C132 420 114 340 130 260 C150 170 212 80 256 44 Z"/></clipPath>
  </defs>

  <ellipse cx="256" cy="474" rx="150" ry="18" fill="url(#shadow)"/>

  <!-- little arms -->
  <path d="M136 300 C100 300 84 340 92 380 C104 392 126 386 134 370 C140 350 144 330 146 318 Z" fill="url(#limb)" stroke="#1d4a8c" stroke-width="3"/>
  <path d="M376 300 C412 300 428 340 420 380 C408 392 386 386 378 370 C372 350 368 330 366 318 Z" fill="url(#limb)" stroke="#1d4a8c" stroke-width="3"/>
  <!-- little feet -->
  <ellipse cx="206" cy="440" rx="40" ry="24" fill="url(#limb)" stroke="#1d4a8c" stroke-width="3"/>
  <ellipse cx="306" cy="440" rx="40" ry="24" fill="url(#limb)" stroke="#1d4a8c" stroke-width="3"/>
  <path d="M184 452 l0 -10 M206 456 l0 -10 M228 452 l0 -10 M284 452 l0 -10 M306 456 l0 -10 M328 452 l0 -10" stroke="#1d4a8c" stroke-width="3" stroke-linecap="round"/>

  <!-- body -->
  <path d="M256 44 C300 80 362 170 382 260 C398 340 380 420 256 432 C132 420 114 340 130 260 C150 170 212 80 256 44 Z"
        fill="url(#water)" stroke="#1d4a8c" stroke-width="4" stroke-linejoin="round"/>
  <!-- deeper water patches -->
  <g clip-path="url(#clip)" fill="#2f7cc8" opacity=".35">
    <ellipse cx="160" cy="200" rx="40" ry="60"/><ellipse cx="350" cy="230" rx="34" ry="50"/>
    <ellipse cx="180" cy="390" rx="50" ry="30"/><ellipse cx="330" cy="400" rx="40" ry="26"/>
  </g>
  <path d="M214 110 C190 150 172 190 166 230" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".7"/>
  <g fill="#fff" opacity=".7">
    <circle cx="300" cy="140" r="6"/><circle cx="180" cy="340" r="9"/><circle cx="340" cy="360" r="7"/><circle cx="230" cy="390" r="5"/><circle cx="300" cy="310" r="4"/>
  </g>

  <!-- big dark eyes -->
  <circle cx="206" cy="250" r="30" fill="url(#eye)" stroke="#06102a" stroke-width="2"/>
  <circle cx="306" cy="250" r="30" fill="url(#eye)" stroke="#06102a" stroke-width="2"/>
  <circle cx="196" cy="238" r="9" fill="#fff"/><circle cx="296" cy="238" r="9" fill="#fff"/>
  <circle cx="216" cy="262" r="4" fill="#fff" opacity=".8"/><circle cx="316" cy="262" r="4" fill="#fff" opacity=".8"/>
  <!-- blush and :3 smile -->
  <ellipse cx="174" cy="292" rx="18" ry="9" fill="#ff9fb6" opacity=".55"/>
  <ellipse cx="338" cy="292" rx="18" ry="9" fill="#ff9fb6" opacity=".55"/>
  <path d="M236 292 q10 10 20 0 q10 10 20 0" fill="none" stroke="#0e1b42" stroke-width="3.5" stroke-linecap="round"/>

  <!-- bubbles -->
  <use xlink:href="#b" transform="translate(110 150) scale(1.5)"/>
  <use xlink:href="#b" transform="translate(410 120) scale(1.8)"/>
  <use xlink:href="#b" transform="translate(84 250) scale(1.1)"/>
  <use xlink:href="#b" transform="translate(436 250) scale(1.3)"/>
  <use xlink:href="#b" transform="translate(450 420) scale(1)"/>
  <use xlink:href="#b" transform="translate(70 430) scale(1.2)"/>
  <use xlink:href="#b" transform="translate(160 80) scale(.8)"/>
</svg>
