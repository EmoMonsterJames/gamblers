<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ROYGBIV: the seven Prisma-Arches fused into one colossal rainbow serpent; a white diamond-prism body splits into seven glowing ribbons -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fffbe8" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e6f0ff"/><stop offset="1" stop-color="#c8d4ff"/></linearGradient>
  </defs>
  <circle cx="256" cy="250" r="250" fill="url(#glow)"/>
  <!-- seven ribbons of colour, each a section of the rainbow -->
  <g fill="none" stroke-linecap="round" stroke-width="18">
    <path d="M40 470 A216 216 0 0 1 472 470" stroke="#ff2a2a"/>
    <path d="M58 470 A198 198 0 0 1 454 470" stroke="#ff8a1a"/>
    <path d="M76 470 A180 180 0 0 1 436 470" stroke="#ffe21a"/>
    <path d="M94 470 A162 162 0 0 1 418 470" stroke="#2ac85a"/>
    <path d="M112 470 A144 144 0 0 1 400 470" stroke="#1a7aff"/>
    <path d="M130 470 A126 126 0 0 1 382 470" stroke="#4a2ad8"/>
    <path d="M148 470 A108 108 0 0 1 364 470" stroke="#b03aff"/>
  </g>
  <!-- rune field (indigo/violet) and plasma sparks (orange/yellow) -->
  <g fill="none" stroke="#fff" stroke-width="3" opacity=".9"><path d="M60 200 l10 -14 l10 14 l-10 14 Z M440 190 q10 -12 20 0 q-10 12 -20 0"/></g>
  <path d="M200 70 l10 -20 l-4 16 l14 -6 M330 60 l-8 -18 l12 10 l2 -16" fill="none" stroke="#ffb81a" stroke-width="4"/>
  <!-- diamond prism serpent body arching over the top -->
  <path d="M120 300 C120 170 180 110 256 108 C332 110 392 170 392 300 L360 300 C360 196 316 146 256 146 C196 146 152 196 152 300 Z" fill="url(#prism)" stroke="#6a7aaa" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#9aa8d8" stroke-width="3" fill="none"><path d="M130 240 L160 220 L150 270 M180 150 L210 160 L190 190 M256 112 L270 140 L240 142 M330 150 L300 160 L322 190 M382 240 L352 220 L362 270"/></g>
  <!-- divine head with a jewel crown -->
  <path d="M206 82 L226 30 L246 70 L256 20 L266 70 L286 30 L306 82 Z" fill="#fff8c8" stroke="#c8a020" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="256" cy="52" r="7" fill="#ff2a8a"/>
  <path d="M196 120 C196 86 222 72 256 72 C290 72 316 86 316 120 C316 156 290 176 256 176 C222 176 196 156 196 120 Z" fill="url(#prism)" stroke="#6a7aaa" stroke-width="6"/>
  <path d="M220 116 Q232 104 244 116 Q232 126 220 116 Z M268 116 Q280 104 292 116 Q280 126 268 116 Z" fill="#fff" stroke="#3a4a8a" stroke-width="3"/>
  <circle cx="232" cy="116" r="5" fill="#ff2a2a"/><circle cx="280" cy="116" r="5" fill="#1a7aff"/>
  <path d="M240 148 Q256 158 272 148" fill="none" stroke="#3a4a8a" stroke-width="4" stroke-linecap="round"/>
  <!-- blinding light rays -->
  <g stroke="#fffbe0" stroke-width="5" stroke-linecap="round" opacity=".9"><path d="M256 4 v10 M150 40 l8 8 M362 40 l-8 8 M110 120 h12 M390 120 h12"/></g>
  <text x="256" y="330" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="#fff" stroke="#3a4a8a" stroke-width="2">ROYGBIV</text>
</svg>
