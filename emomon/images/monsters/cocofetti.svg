<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Cocofetti: a floating pastel fluff ball that sheds glitter and confetti wherever it drifts -->
  <defs>
    <radialGradient id="fluff" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#f8bbd0"/><stop offset=".75" stop-color="#ce93d8"/><stop offset="1" stop-color="#90caf9"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff9c4" stop-opacity=".7"/><stop offset="1" stop-color="#f8bbd0" stop-opacity="0"/></radialGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6a1b9a" stop-opacity=".25"/><stop offset="1" stop-color="#6a1b9a" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="240" r="240" fill="url(#aura)"/>
  <ellipse cx="256" cy="460" rx="110" ry="12" fill="url(#sh)"/>
  <!-- fluffy outline: ring of puffs -->
  <g fill="url(#fluff)" stroke="#8e24aa" stroke-width="6">
    <circle cx="256" cy="110" r="52"/><circle cx="350" cy="140" r="52"/><circle cx="392" cy="226" r="52"/><circle cx="364" cy="318" r="52"/>
    <circle cx="256" cy="350" r="56"/><circle cx="148" cy="318" r="52"/><circle cx="120" cy="226" r="52"/><circle cx="162" cy="140" r="52"/>
  </g>
  <circle cx="256" cy="230" r="140" fill="url(#fluff)"/>
  <!-- tiny feet tufts -->
  <ellipse cx="216" cy="404" rx="22" ry="12" fill="#f8bbd0" stroke="#8e24aa" stroke-width="5"/><ellipse cx="296" cy="404" rx="22" ry="12" fill="#f8bbd0" stroke="#8e24aa" stroke-width="5"/>
  <!-- face -->
  <ellipse cx="212" cy="220" rx="24" ry="28" fill="#fff" stroke="#4a148c" stroke-width="5"/>
  <ellipse cx="300" cy="220" rx="24" ry="28" fill="#fff" stroke="#4a148c" stroke-width="5"/>
  <circle cx="214" cy="224" r="14" fill="#311b92"/><circle cx="302" cy="224" r="14" fill="#311b92"/>
  <circle cx="219" cy="216" r="6" fill="#fff"/><circle cx="307" cy="216" r="6" fill="#fff"/><circle cx="209" cy="232" r="3" fill="#fff"/><circle cx="297" cy="232" r="3" fill="#fff"/>
  <path d="M236 274 Q256 294 276 274" fill="#ff80ab" stroke="#4a148c" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="178" cy="266" rx="16" ry="9" fill="#ff80ab" opacity=".6"/><ellipse cx="334" cy="266" rx="16" ry="9" fill="#ff80ab" opacity=".6"/>
  <!-- confetti -->
  <rect x="60" y="80" width="18" height="8" fill="#ffd54f" transform="rotate(30 69 84)"/>
  <rect x="440" y="100" width="18" height="8" fill="#4dd0e1" transform="rotate(-20 449 104)"/>
  <rect x="460" y="300" width="16" height="8" fill="#f06292" transform="rotate(45 468 304)"/>
  <rect x="40" y="320" width="16" height="8" fill="#81c784" transform="rotate(-35 48 324)"/>
  <rect x="100" y="430" width="16" height="7" fill="#ba68c8" transform="rotate(15 108 433)"/>
  <rect x="390" y="440" width="16" height="7" fill="#ffb74d" transform="rotate(-50 398 443)"/>
  <circle cx="90" cy="200" r="6" fill="#f06292"/><circle cx="430" cy="200" r="6" fill="#ffd54f"/><circle cx="160" cy="460" r="5" fill="#4dd0e1"/><circle cx="350" cy="30" r="6" fill="#81c784"/>
  <!-- glitter stars -->
  <path d="M120 60 l5 -15 l5 15 l15 5 l-15 5 l-5 15 l-5 -15 l-15 -5 Z" fill="#fff59d"/>
  <path d="M420 380 l5 -15 l5 15 l15 5 l-15 5 l-5 15 l-5 -15 l-15 -5 Z" fill="#fff59d"/>
  <path d="M470 40 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z" fill="#fff"/>
  <path d="M30 420 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z" fill="#fff"/>
</svg>
