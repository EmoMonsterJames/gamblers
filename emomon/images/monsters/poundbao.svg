<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Poundbao: a heavy round bao dumpling of cast iron and riveted steel; its pleats are spikes and steam jets from the top -->
  <defs>
    <radialGradient id="iron" cx="38%" cy="30%" r="72%"><stop offset="0" stop-color="#d8dee6"/><stop offset=".5" stop-color="#7c8794"/><stop offset="1" stop-color="#2e3640"/></radialGradient>
    <radialGradient id="steam" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="aura" cx="50%" cy="55%" r="50%"><stop offset="0" stop-color="#ffd0a0" stop-opacity=".45"/><stop offset="1" stop-color="#ffd0a0" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="256" cy="270" r="236" fill="url(#aura)"/>
  <ellipse cx="256" cy="458" rx="170" ry="18" fill="#10141a" opacity=".35"/>
  <!-- scorching steam blast -->
  <circle cx="256" cy="90" r="56" fill="url(#steam)"/><circle cx="216" cy="60" r="40" fill="url(#steam)"/><circle cx="300" cy="54" r="44" fill="url(#steam)"/>
  <!-- dumpling body -->
  <path d="M80 380 C70 280 140 170 256 150 C372 170 442 280 432 380 C420 440 92 440 80 380 Z" fill="url(#iron)" stroke="#1a2028" stroke-width="9" stroke-linejoin="round"/>
  <!-- pleats rising to the vent = armored spikes -->
  <g fill="none" stroke="#1a2028" stroke-width="7" stroke-linecap="round">
    <path d="M256 160 C210 200 170 240 132 300"/><path d="M256 160 C232 210 214 250 200 300"/><path d="M256 160 V300"/>
    <path d="M256 160 C280 210 298 250 312 300"/><path d="M256 160 C302 200 342 240 380 300"/>
  </g>
  <g fill="#c8d0da" stroke="#1a2028" stroke-width="5" stroke-linejoin="round">
    <path d="M210 196 l-14 -30 l28 12 Z"/><path d="M302 196 l14 -30 l-28 12 Z"/><path d="M168 236 l-24 -22 l32 2 Z"/><path d="M344 236 l24 -22 l-32 2 Z"/>
  </g>
  <ellipse cx="256" cy="158" rx="26" ry="12" fill="#1a2028"/>
  <ellipse cx="256" cy="156" rx="14" ry="6" fill="#ff6a2a"/>
  <!-- rivets -->
  <g fill="#e6ebf0" stroke="#1a2028" stroke-width="3"><circle cx="120" cy="360" r="8"/><circle cx="170" cy="396" r="8"/><circle cx="256" cy="410" r="8"/><circle cx="342" cy="396" r="8"/><circle cx="392" cy="360" r="8"/></g>
  <ellipse cx="190" cy="240" rx="40" ry="18" fill="#fff" opacity=".35" transform="rotate(-30 190 240)"/>
  <!-- stubborn face -->
  <ellipse cx="206" cy="326" rx="20" ry="16" fill="#fff" stroke="#1a2028" stroke-width="5"/><ellipse cx="306" cy="326" rx="20" ry="16" fill="#fff" stroke="#1a2028" stroke-width="5"/>
  <circle cx="210" cy="330" r="8" fill="#1a1a1a"/><circle cx="302" cy="330" r="8" fill="#1a1a1a"/>
  <path d="M180 302 l46 10 M332 302 l-46 10" stroke="#1a2028" stroke-width="8" stroke-linecap="round"/>
  <path d="M232 372 Q256 360 280 372" fill="none" stroke="#1a2028" stroke-width="6" stroke-linecap="round"/>
  <!-- rocking motion lines -->
  <path d="M60 420 q-14 -30 0 -60 M452 420 q14 -30 0 -60" fill="none" stroke="#8a95a2" stroke-width="7" stroke-linecap="round"/>
</svg>
