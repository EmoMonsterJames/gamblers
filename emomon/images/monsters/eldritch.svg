  <path d="M256 128 C196 128 180 190 186 236 C200 280 312 280 326 236 C332 190 316 128 256 128 Z" fill="#0d0420" stroke="#16052e" stroke-width="7"/>
  <!-- glowing eyes -->
  <ellipse cx="226" cy="206" rx="16" ry="10" fill="#ea80fc"/><ellipse cx="286" cy="206" rx="16" ry="10" fill="#ea80fc"/>
  <ellipse cx="226" cy="206" rx="6" ry="6" fill="#fff"/><ellipse cx="286" cy="206" rx="6" ry="6" fill="#fff"/>
  <!-- trim -->
  <path d="M186 236 C200 280 312 280 326 236" fill="none" stroke="#ffd54f" stroke-width="6"/>
  <path d="M256 280 L256 420" stroke="#ffd54f" stroke-width="6" stroke-dasharray="14 10"/>
  <!-- strong arms / sleeves -->
  <path d="M150 260 C110 280 90 320 96 352 L140 344 C140 316 156 296 176 286 Z" fill="url(#robe)" stroke="#16052e" stroke-width="7" stroke-linejoin="round"/>
  <path d="M362 260 C402 280 422 320 416 352 L372 344 C372 316 356 296 336 286 Z" fill="url(#robe)" stroke="#16052e" stroke-width="7" stroke-linejoin="round"/>
  <!-- magic orbs in hands -->
  <circle cx="114" cy="362" r="30" fill="url(#orb)" stroke="#4a148c" stroke-width="6"/>
  <circle cx="398" cy="362" r="30" fill="url(#orb)" stroke="#4a148c" stroke-width="6"/>
  <path d="M60 300 L66 312 L78 318 L66 324 L60 336 L54 324 L42 318 L54 312 Z M452 300 L458 312 L470 318 L458 324 L452 336 L446 324 L434 318 L446 312 Z" fill="#f8bbd0"/>
