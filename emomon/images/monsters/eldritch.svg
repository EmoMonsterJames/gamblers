<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7e57c2"/><stop offset="100%" stop-color="#2a0f4f"/></linearGradient>
    <radialGradient id="aura" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#e040fb" stop-opacity=".45"/><stop offset="100%" stop-color="#e040fb" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#ea80fc"/><stop offset="100%" stop-color="#6a1b9a"/></radialGradient>
  </defs>
  <circle cx="256" cy="240" r="250" fill="url(#aura)"/>
  <!-- rune circle -->
  <circle cx="256" cy="250" r="200" fill="none" stroke="#ce93d8" stroke-width="4" stroke-dasharray="6 14" opacity=".8"/>
  <!-- robe body tapering into wisps -->
  <path d="M256 90 C170 90 140 170 140 240 C140 320 120 380 90 450 C130 430 150 460 180 440 C200 470 230 450 256 470 C282 450 312 470 332 440 C362 460 382 430 422 450 C392 380 372 320 372 240 C372 170 342 90 256 90 Z" fill="url(#robe)" stroke="#16052e" stroke-width="9" stroke-linejoin="round"/>
